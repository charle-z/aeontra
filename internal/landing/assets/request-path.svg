<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MCP Devbox request path</title>
  <desc id="desc">An AI client sends an authenticated request to MCP Devbox policy. Consequential effects require an expiring plan and owner approval before bounded adapters reach GitHub, Coolify, validation, Brain or an outbound-only Edge.</desc>
  <rect width="1200" height="720" fill="#000050"/>
  <g fill="none" stroke="#54FCFC" stroke-width="3">
    <path d="M200 132 H470"/>
    <path d="M730 132 H1000"/>
    <path d="M600 214 V306"/>
    <path d="M600 388 V476"/>
    <path d="M600 558 V622"/>
    <path d="M600 622 H160 V652"/>
    <path d="M600 622 H380 V652"/>
    <path d="M600 622 H600 V652"/>
    <path d="M600 622 H820 V652"/>
    <path d="M600 622 H1040 V652"/>
  </g>
  <g fill="#54FCFC">
    <polygon points="465,124 485,132 465,140"/>
    <polygon points="995,124 1015,132 995,140"/>
    <polygon points="592,300 600,320 608,300"/>
    <polygon points="592,470 600,490 608,470"/>
    <polygon points="592,616 600,636 608,616"/>
  </g>

  <g font-family="Cascadia Mono,Consolas,Courier New,monospace" text-anchor="middle">
    <g>
      <rect x="40" y="62" width="320" height="140" fill="#0000A8" stroke="#54FCFC" stroke-width="3"/>
      <text x="200" y="112" fill="#FCFC54" font-size="26" font-weight="700">AI CLIENT</text>
      <text x="200" y="148" fill="#F8F8F8" font-size="20">ChatGPT · Codex · OpenCode</text>
      <text x="200" y="176" fill="#A8A8A8" font-size="18">authenticated request</text>
    </g>

    <g>
      <rect x="440" y="42" width="320" height="180" fill="#0000A8" stroke="#FCFC54" stroke-width="4"/>
      <text x="600" y="92" fill="#FCFC54" font-size="28" font-weight="700">MCP DEVBOX</text>
      <text x="600" y="130" fill="#F8F8F8" font-size="20">jail · secret deny · allowlist</text>
      <text x="600" y="160" fill="#F8F8F8" font-size="20">bounded output · audit</text>
      <text x="600" y="192" fill="#54FC54" font-size="18">policy owns authority</text>
    </g>

    <g>
      <rect x="840" y="62" width="320" height="140" fill="#0000A8" stroke="#FC5454" stroke-width="3"/>
      <text x="1000" y="112" fill="#FC5454" font-size="26" font-weight="700">PUBLIC LANDING</text>
      <text x="1000" y="148" fill="#F8F8F8" font-size="20">presentation only</text>
      <text x="1000" y="176" fill="#54FC54" font-size="18">no path into policy</text>
    </g>

    <g>
      <rect x="420" y="320" width="360" height="80" fill="#0000A8" stroke="#FCA854" stroke-width="3"/>
      <text x="600" y="353" fill="#FCA854" font-size="23" font-weight="700">SINGLE-USE PLAN</text>
      <text x="600" y="382" fill="#F8F8F8" font-size="18">expiring · exact effect · revalidated</text>
    </g>

    <g>
      <rect x="420" y="490" width="360" height="80" fill="#0000A8" stroke="#FCA854" stroke-width="3"/>
      <text x="600" y="523" fill="#FCA854" font-size="23" font-weight="700">OWNER APPROVAL</text>
      <text x="600" y="552" fill="#F8F8F8" font-size="18">required for consequential effects</text>
    </g>

    <g font-size="18">
      <rect x="50" y="640" width="220" height="60" fill="#0000A8" stroke="#54FCFC" stroke-width="2"/>
      <text x="160" y="676" fill="#F8F8F8">GitHub</text>
      <rect x="290" y="640" width="220" height="60" fill="#0000A8" stroke="#54FCFC" stroke-width="2"/>
      <text x="400" y="676" fill="#F8F8F8">Coolify</text>
      <rect x="530" y="640" width="140" height="60" fill="#0000A8" stroke="#54FCFC" stroke-width="2"/>
      <text x="600" y="676" fill="#F8F8F8">Brain</text>
      <rect x="690" y="640" width="220" height="60" fill="#0000A8" stroke="#54FCFC" stroke-width="2"/>
      <text x="800" y="676" fill="#F8F8F8">Validation</text>
      <rect x="930" y="640" width="220" height="60" fill="#0000A8" stroke="#54FC54" stroke-width="2"/>
      <text x="1040" y="668" fill="#54FC54">Outbound Edge</text>
      <text x="1040" y="690" fill="#A8A8A8" font-size="14">independent local policy</text>
    </g>
  </g>
</svg>
