<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1400 820" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Aeontra request paths</title>
  <desc id="desc">An authenticated request reaches Aeontra policy. Reads and allowlisted commands execute directly with audit. Consequential actions branch through a single-use plan and owner approval before bounded execution. The public landing is shown separately, outside the request path.</desc>
  <rect width="1400" height="820" fill="#000050"/>

  <g fill="none" stroke="#54FCFC" stroke-width="4">
    <path d="M340 130 H510"/>
    <path d="M610 230 C520 275 410 300 300 340"/>
    <path d="M300 440 V520"/>
  </g>
  <g fill="none" stroke="#FCA854" stroke-width="4">
    <path d="M790 230 C880 275 990 300 1100 330"/>
    <path d="M1100 420 V465"/>
    <path d="M1100 555 V600"/>
    <path d="M1100 690 V735"/>
  </g>
  <g fill="#54FCFC">
    <polygon points="500,120 525,130 500,140"/>
    <polygon points="292,510 300,535 308,510"/>
  </g>
  <g fill="#FCA854">
    <polygon points="1092,455 1100,480 1108,455"/>
    <polygon points="1092,590 1100,615 1108,590"/>
    <polygon points="1092,725 1100,750 1108,725"/>
  </g>

  <g font-family="Cascadia Mono,Consolas,Courier New,monospace" text-anchor="middle">
    <g>
      <rect x="40" y="55" width="300" height="150" fill="#0000A8" stroke="#54FCFC" stroke-width="3"/>
      <text x="190" y="105" fill="#FCFC54" font-size="26" font-weight="700">AI CLIENT</text>
      <text x="190" y="142" fill="#F8F8F8" font-size="19">ChatGPT · Codex · OpenCode</text>
      <text x="190" y="174" fill="#A8A8A8" font-size="17">authenticated request</text>
    </g>

    <g>
      <rect x="510" y="35" width="380" height="200" fill="#0000A8" stroke="#FCFC54" stroke-width="4"/>
      <text x="700" y="88" fill="#FCFC54" font-size="29" font-weight="700">AEONTRA</text>
      <text x="700" y="128" fill="#F8F8F8" font-size="20">jail · secret deny · allowlist</text>
      <text x="700" y="162" fill="#F8F8F8" font-size="20">bounded output · policy · audit</text>
      <text x="700" y="202" fill="#54FC54" font-size="18">authority branches by effect</text>
    </g>

    <g id="public-landing-outside-request-path">
      <rect x="1025" y="20" width="350" height="220" fill="none" stroke="#FC5454" stroke-width="2" stroke-dasharray="10 8"/>
      <text x="1200" y="50" fill="#FC5454" font-size="17" font-weight="700">OUTSIDE REQUEST PATH</text>
      <rect x="1055" y="70" width="290" height="145" fill="#0000A8" stroke="#FC5454" stroke-width="3"/>
      <text x="1200" y="115" fill="#FC5454" font-size="25" font-weight="700">PUBLIC LANDING</text>
      <text x="1200" y="152" fill="#F8F8F8" font-size="19">presentation only</text>
      <text x="1200" y="184" fill="#54FC54" font-size="17">no path into policy</text>
    </g>

    <g>
      <text x="300" y="302" fill="#54FCFC" font-size="20" font-weight="700">DIRECT UNDER POLICY</text>
      <rect x="70" y="340" width="460" height="100" fill="#0000A8" stroke="#54FCFC" stroke-width="3"/>
      <text x="300" y="382" fill="#54FCFC" font-size="22" font-weight="700">read / allowlisted command</text>
      <text x="300" y="416" fill="#F8F8F8" font-size="18">jailed · bounded · policy checked</text>

      <rect x="70" y="535" width="460" height="120" fill="#0000A8" stroke="#54FC54" stroke-width="3"/>
      <text x="300" y="580" fill="#54FC54" font-size="24" font-weight="700">execute + audit</text>
      <text x="300" y="615" fill="#F8F8F8" font-size="18">repository · Brain · validation</text>
      <text x="300" y="642" fill="#A8A8A8" font-size="16">no owner approval step</text>
    </g>

    <g>
      <text x="1100" y="292" fill="#FCA854" font-size="20" font-weight="700">CONSEQUENTIAL</text>
      <rect x="870" y="330" width="460" height="90" fill="#0000A8" stroke="#FCA854" stroke-width="3"/>
      <text x="1100" y="368" fill="#FCA854" font-size="22" font-weight="700">publish · deploy · create repository</text>
      <text x="1100" y="399" fill="#F8F8F8" font-size="17">external or live-state effect</text>

      <rect x="870" y="480" width="460" height="75" fill="#0000A8" stroke="#FCA854" stroke-width="3"/>
      <text x="1100" y="513" fill="#FCA854" font-size="23" font-weight="700">SINGLE-USE PLAN</text>
      <text x="1100" y="540" fill="#F8F8F8" font-size="16">expiring · exact effect · bound state</text>

      <rect x="870" y="615" width="460" height="75" fill="#0000A8" stroke="#FCA854" stroke-width="3"/>
      <text x="1100" y="648" fill="#FCA854" font-size="23" font-weight="700">OWNER APPROVAL</text>
      <text x="1100" y="675" fill="#F8F8F8" font-size="16">single use · revalidated before execution</text>

      <rect x="870" y="750" width="460" height="55" fill="#0000A8" stroke="#54FC54" stroke-width="3"/>
      <text x="1100" y="784" fill="#54FC54" font-size="22" font-weight="700">EXECUTE + AUDIT · GitHub / Coolify</text>
    </g>
  </g>
</svg>
