name: Security Evidence

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.0
        with:
          languages: go
          build-mode: manual

      - name: Build for CodeQL
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.0
        with:
          category: /language:go

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  container-evidence:
    name: Container SBOM and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Build local image
        run: docker build --file Dockerfile --tag mcp-devbox:ci .

      - name: Build stable front door image
        run: docker build --file Dockerfile.front-door --tag mcp-front-door:ci .

      - name: Generate local SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: mcp-devbox:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify SBOM
        run: test -s sbom.spdx.json

      - name: Generate stable front door SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: mcp-front-door:ci
          format: spdx-json
          output-file: front-door-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify stable front door SBOM
        run: test -s front-door-sbom.spdx.json

      - name: Scan local image
        uses: anchore/scan-action@v7.4.0
        with:
          image: mcp-devbox:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: grype.json
          cache-db: true

      - name: Verify vulnerability report
        run: test -s grype.json

      - name: Enforce vulnerability threshold
        run: go run ./cmd/grype-gate --report grype.json --minimum high --annotation-file Dockerfile

      - name: Scan stable front door image
        uses: anchore/scan-action@v7.4.0
        with:
          image: mcp-front-door:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: front-door-grype.json
          cache-db: true

      - name: Verify stable front door vulnerability report
        run: test -s front-door-grype.json

      - name: Enforce stable front door vulnerability threshold
        run: go run ./cmd/grype-gate --report front-door-grype.json --minimum high --annotation-file Dockerfile.front-door
