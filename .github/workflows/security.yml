name: Security Evidence

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -eu
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          test -x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan complete Git history and current tree
        run: |
          set -eu
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --log-opts="--all" .
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact .

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: go
          build-mode: manual

      - name: Build for CodeQL
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: /language:go

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  container-evidence:
    name: Container SBOM and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build local image
        run: docker build --file Dockerfile --tag mcp-devbox:ci .

      - name: Build isolated public site image
        run: docker build --file Dockerfile.site --tag aeontra-site:ci .

      - name: Build stable front door image
        run: docker build --file Dockerfile.front-door --tag mcp-front-door:ci .

      - name: Build private front door coordinator image
        run: docker build --file Dockerfile.front-door-coordinator --tag mcp-front-door-coordinator:ci .

      - name: Build private validation runner image
        run: docker build --file Dockerfile.validation-runner --tag mcp-validation-runner:ci .

      - name: Build private sandbox runner image
        run: docker build --file Dockerfile.sandbox-runner --tag mcp-sandbox-runner:ci .

      - name: Build pinned sandbox workcell image
        run: docker build --file Dockerfile.sandbox-workcell --tag mcp-sandbox-workcell:ci .

      - name: Verify sandbox workcell toolchains without network or root
        run: sh scripts/test-sandbox-workcell-toolchains.sh mcp-sandbox-workcell:ci

      - name: Verify private coordinator named-volume startup
        run: sh scripts/test-front-door-coordinator-volume.sh

      - name: Generate local SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mcp-devbox:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify SBOM
        run: test -s sbom.spdx.json

      - name: Generate isolated public site SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: aeontra-site:ci
          format: spdx-json
          output-file: aeontra-site-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify isolated public site SBOM
        run: test -s aeontra-site-sbom.spdx.json

      - name: Generate stable front door SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mcp-front-door:ci
          format: spdx-json
          output-file: front-door-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify stable front door SBOM
        run: test -s front-door-sbom.spdx.json

      - name: Generate private front door coordinator SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mcp-front-door-coordinator:ci
          format: spdx-json
          output-file: front-door-coordinator-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify private front door coordinator SBOM
        run: test -s front-door-coordinator-sbom.spdx.json

      - name: Generate private validation runner SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mcp-validation-runner:ci
          format: spdx-json
          output-file: validation-runner-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify private validation runner SBOM
        run: test -s validation-runner-sbom.spdx.json

      - name: Generate private sandbox runner SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mcp-sandbox-runner:ci
          format: spdx-json
          output-file: sandbox-runner-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify private sandbox runner SBOM
        run: test -s sandbox-runner-sbom.spdx.json

      - name: Generate sandbox workcell SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: mcp-sandbox-workcell:ci
          format: spdx-json
          output-file: sandbox-workcell-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify sandbox workcell SBOM
        run: test -s sandbox-workcell-sbom.spdx.json

      - name: Scan local image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: mcp-devbox:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: grype.json
          cache-db: true

      - name: Verify vulnerability report
        run: test -s grype.json

      - name: Enforce vulnerability threshold
        run: go run ./cmd/grype-gate --report grype.json --minimum high --annotation-file Dockerfile

      - name: Scan isolated public site image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: aeontra-site:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: aeontra-site-grype.json
          cache-db: true

      - name: Verify isolated public site vulnerability report
        run: test -s aeontra-site-grype.json

      - name: Enforce isolated public site vulnerability threshold
        run: go run ./cmd/grype-gate --report aeontra-site-grype.json --minimum high --annotation-file Dockerfile.site

      - name: Scan stable front door image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: mcp-front-door:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: front-door-grype.json
          cache-db: true

      - name: Verify stable front door vulnerability report
        run: test -s front-door-grype.json

      - name: Enforce stable front door vulnerability threshold
        run: go run ./cmd/grype-gate --report front-door-grype.json --minimum high --annotation-file Dockerfile.front-door

      - name: Scan private front door coordinator image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: mcp-front-door-coordinator:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: front-door-coordinator-grype.json
          cache-db: true

      - name: Verify private front door coordinator vulnerability report
        run: test -s front-door-coordinator-grype.json

      - name: Enforce private front door coordinator vulnerability threshold
        run: go run ./cmd/grype-gate --report front-door-coordinator-grype.json --minimum high --annotation-file Dockerfile.front-door-coordinator

      - name: Scan private validation runner image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: mcp-validation-runner:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: validation-runner-grype.json
          cache-db: true

      - name: Verify private validation runner vulnerability report
        run: test -s validation-runner-grype.json

      - name: Enforce private validation runner vulnerability threshold
        run: go run ./cmd/grype-gate --report validation-runner-grype.json --minimum high --annotation-file Dockerfile.validation-runner

      - name: Scan private sandbox runner image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: mcp-sandbox-runner:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: sandbox-runner-grype.json
          cache-db: true

      - name: Verify private sandbox runner vulnerability report
        run: test -s sandbox-runner-grype.json

      - name: Enforce private sandbox runner vulnerability threshold
        run: go run ./cmd/grype-gate --report sandbox-runner-grype.json --minimum high --annotation-file Dockerfile.sandbox-runner

      - name: Scan sandbox workcell image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: mcp-sandbox-workcell:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: sandbox-workcell-grype.json
          cache-db: true

      - name: Verify sandbox workcell vulnerability report
        run: test -s sandbox-workcell-grype.json

      - name: Enforce sandbox workcell vulnerability threshold
        run: go run ./cmd/grype-gate --report sandbox-workcell-grype.json --minimum high --annotation-file Dockerfile.sandbox-workcell
