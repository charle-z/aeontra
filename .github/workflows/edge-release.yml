name: Publish signed Aeontra Edge release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact immutable Edge release (p15.x.y bridge or vMAJOR.MINOR.PATCH)
        required: true
        type: string
      generation:
        description: Use codex-v4 once as the updater bridge, then codex-v5 for Codex-only releases
        required: true
        type: choice
        options:
          - bridge-v3
          - codex-v4
          - codex-v5

permissions:
  contents: read

concurrency:
  group: aeontra-edge-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish official stable bundle
    needs: build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: edge-release
    permissions:
      contents: write

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate immutable release input
        env:
          RELEASE: ${{ inputs.release }}
          GENERATION: ${{ inputs.generation }}
        run: |
          [[ "$RELEASE" =~ ^p15\.[0-9]+\.[0-9]+$ || "$RELEASE" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GENERATION" = bridge-v3 || "$GENERATION" = codex-v4 || "$GENERATION" = codex-v5 ]]
          if [[ "$RELEASE" = v* ]]; then
            [[ "$GENERATION" = codex-v4 || "$GENERATION" = codex-v5 ]]
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          ! git rev-parse "$RELEASE" >/dev/null 2>&1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pinned Node
        if: inputs.generation != 'codex-v5'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: test/opencode-e2e/package-lock.json

      - name: Install pinned OpenCode
        if: inputs.generation != 'codex-v5'
        run: npm ci --prefix test/opencode-e2e --no-audit --no-fund

      - name: Verify release source before exposing signing identities
        run: |
          go test -p 1 ./internal/bundle ./internal/edgeupdate ./internal/autopilot ./cmd/mcp-edge ./cmd/mcp-bundle-updater ./packaging/debian ./packaging/parrot -count=1
          go vet ./...
          go build ./...
          git diff --check

      - name: Build minimal signing executables
        run: |
          install -d -m 0755 "$RUNNER_TEMP/release/signers"
          go build -trimpath -o "$RUNNER_TEMP/release/signers/mcp-bundle-manifest" ./cmd/mcp-bundle-manifest
          go build -trimpath -o "$RUNNER_TEMP/release/signers/mcp-release-channel" ./cmd/mcp-release-channel

      - name: Derive non-secret release public key
        env:
          EDGE_PRIVATE_KEY_B64: ${{ secrets.EDGE_BUNDLE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          test -n "$EDGE_PRIVATE_KEY_B64"
          key_path="$RUNNER_TEMP/release/edge.key"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$EDGE_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          chmod 0600 "$key_path"
          test "$(stat -c %s "$key_path")" = 64
          public_key="$(tail -c 32 "$key_path" | od -An -tx1 | tr -d ' \n')"
          [[ "$public_key" =~ ^[a-f0-9]{64}$ ]]
          printf '%s\n' "$public_key" > "$RUNNER_TEMP/release/edge-public-key.hex"

      - name: Build unsigned release payloads
        env:
          RELEASE: ${{ inputs.release }}
          GENERATION: ${{ inputs.generation }}
        run: |
          commit="$(git rev-parse HEAD)"
          catalog="$(go run ./cmd/mcp-catalog-id)"
          public_key="$(cat "$RUNNER_TEMP/release/edge-public-key.hex")"
          bash packaging/github-cli/stage-pinned.sh --output "$RUNNER_TEMP/release/gh"
          manifest_version=3
          codex_args=()
          legacy_args=()
          if [ "$GENERATION" = codex-v4 ]; then
            manifest_version=4
          elif [ "$GENERATION" = codex-v5 ]; then
            manifest_version=5
          fi
          printf '%s\n' "$commit" > "$RUNNER_TEMP/release/commit.txt"
          printf '%s\n' "$catalog" > "$RUNNER_TEMP/release/catalog.txt"
          printf '%s\n' "$manifest_version" > "$RUNNER_TEMP/release/manifest-version.txt"
          if [ "$GENERATION" = codex-v4 ] || [ "$GENERATION" = codex-v5 ]; then
            bash packaging/codex/stage-pinned.sh \
              --output-bin "$RUNNER_TEMP/release/codex" \
              --output-pin "$RUNNER_TEMP/release/codex-pin.json"
            codex_args=(--codex-bin "$RUNNER_TEMP/release/codex" --codex-pin "$RUNNER_TEMP/release/codex-pin.json")
          fi
          if [ "$GENERATION" != codex-v5 ]; then
            legacy_args=(
              --node-bin "$(command -v node)"
              --opencode-bin "$GITHUB_WORKSPACE/test/opencode-e2e/node_modules/opencode-linux-x64/bin/opencode"
              --opencode-lock "$GITHUB_WORKSPACE/test/opencode-e2e/package-lock.json"
            )
          fi
          stage_args=(
            --output "$RUNNER_TEMP/release/bundle" --release "$RELEASE" --commit "$commit"
            --manifest-version "$manifest_version"
            --catalog "$catalog" --public-key "$public_key"
            --gh-bin "$RUNNER_TEMP/release/gh"
          )
          stage_args+=("${legacy_args[@]}")
          stage_args+=("${codex_args[@]}")
          bash packaging/parrot/stage-edge-bundle.sh "${stage_args[@]}"

      - name: Sign Linux bundle manifest with isolated executable
        env:
          EDGE_PRIVATE_KEY_B64: ${{ secrets.EDGE_BUNDLE_ED25519_PRIVATE_KEY_B64 }}
          RELEASE: ${{ inputs.release }}
          GENERATION: ${{ inputs.generation }}
        run: |
          key_path="$RUNNER_TEMP/release/edge.key"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$EDGE_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          chmod 0600 "$key_path"
          test "$(stat -c %s "$key_path")" = 64
          "$RUNNER_TEMP/release/signers/mcp-bundle-manifest" \
            --root "$RUNNER_TEMP/release/bundle" --release "$RELEASE" \
            --commit "$(cat "$RUNNER_TEMP/release/commit.txt")" --protocol mcp-devbox.edge-bundle.v1 \
            --catalog "$(cat "$RUNNER_TEMP/release/catalog.txt")" --architecture amd64 \
            --manifest-version "$(cat "$RUNNER_TEMP/release/manifest-version.txt")" --private-key "$key_path"

      - name: Build deterministic archives and unsigned Debian package
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          bash packaging/parrot/build-edge-release.sh \
            --bundle "$RUNNER_TEMP/release/bundle" --output "$RUNNER_TEMP/release/assets" \
            --release "$RELEASE" --architecture amd64
          bash packaging/debian/build-edge-deb.sh \
            --bundle "$RUNNER_TEMP/release/bundle" --output "$RUNNER_TEMP/release/assets/$RELEASE" \
            --release "$RELEASE"

      - name: Sign stable Linux channel with isolated executable
        env:
          EDGE_PRIVATE_KEY_B64: ${{ secrets.EDGE_BUNDLE_ED25519_PRIVATE_KEY_B64 }}
          RELEASE: ${{ inputs.release }}
        run: |
          key_path="$RUNNER_TEMP/release/edge.key"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$EDGE_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          chmod 0600 "$key_path"
          test "$(stat -c %s "$key_path")" = 64
          "$RUNNER_TEMP/release/signers/mcp-release-channel" \
            --archive "$RUNNER_TEMP/release/assets/$RELEASE/mcp-devbox-edge_${RELEASE}_amd64.tar.gz" \
            --output "$RUNNER_TEMP/release/assets/stable" --release "$RELEASE" \
            --commit "$(cat "$RUNNER_TEMP/release/commit.txt")" --protocol mcp-devbox.edge-bundle.v1 \
            --catalog "$(cat "$RUNNER_TEMP/release/catalog.txt")" --architecture amd64 \
            --private-key "$key_path"

      - name: Sign Debian package with isolated GPG identity
        env:
          DEB_GPG_PRIVATE_KEY_B64: ${{ secrets.EDGE_DEB_GPG_PRIVATE_KEY_B64 }}
          RELEASE: ${{ inputs.release }}
        run: |
          GNUPGHOME="$RUNNER_TEMP/gnupg"
          export GNUPGHOME
          trap 'gpgconf --homedir "$GNUPGHOME" --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$DEB_GPG_PRIVATE_KEY_B64" | base64 --decode | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="sec" {print $5; exit}')"
          test -n "$key_id"
          deb="$RUNNER_TEMP/release/assets/$RELEASE/mcp-devbox-edge_${RELEASE#v}_amd64.deb"
          if [[ "$RELEASE" = p* ]]; then deb="$RUNNER_TEMP/release/assets/$RELEASE/mcp-devbox-edge_${RELEASE#p}_amd64.deb"; fi
          test -f "$deb"
          gpg --batch --yes --local-user "$key_id" --armor --detach-sign --output "$deb.asc" "$deb"

      - name: Remove release signing identities
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/gnupg" --kill gpg-agent >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/release/edge.key"
          rm -rf "$RUNNER_TEMP/gnupg"

      - name: Generate Edge bundle SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ runner.temp }}/release/bundle
          format: spdx-json
          output-file: ${{ runner.temp }}/release/assets/${{ inputs.release }}/mcp-devbox-edge_${{ inputs.release }}_amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate deterministic third-party notices
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          command -v jq >/dev/null
          metadata="$(go mod download -json github.com/google/go-licenses/v2@v2.0.1)"
          test "$(printf '%s' "$metadata" | jq -r .Sum)" = 'h1:ti+9bi5o7DKbeeg5eBb/uZTgsaPNoJaLCh93cRcXsW8='
          test "$(printf '%s' "$metadata" | jq -r .GoModSum)" = 'h1:efibo0EDNGkau6AIMOViGW+rTNPudhxX9rCxtfw5zKE='
          install -d -m 0755 "$RUNNER_TEMP/release/tools"
          GOBIN="$RUNNER_TEMP/release/tools" go install github.com/google/go-licenses/v2@v2.0.1
          bash packaging/licenses/generate-edge-notices.sh \
            --go-licenses "$RUNNER_TEMP/release/tools/go-licenses" \
            --output "$RUNNER_TEMP/release/assets/$RELEASE" \
            --release "$RELEASE"
          test -s "$RUNNER_TEMP/release/assets/$RELEASE/mcp-devbox-edge_${RELEASE}_amd64.third-party-notices.txt"
          test -s "$RUNNER_TEMP/release/assets/$RELEASE/mcp-devbox-edge_${RELEASE}_windows_amd64.third-party-notices.txt"

      - name: Download verified Windows release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-edge-build-${{ github.sha }}
          path: ${{ runner.temp }}/release/windows-assets

      - name: Publish immutable release and stable signed channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          RELEASE_NOTES: |
            Signed Aeontra Edge release `${{ inputs.release }}` for generation `${{ inputs.generation }}`.

            Choose the package for the Edge host:

            - **Windows package:** download the `_windows_amd64.zip` archive and follow the [Windows installation guide](https://github.com/charle-z/aeontra/blob/main/docs/install-edge-windows.md).
            - **Debian, Parrot, or WSL:** use the amd64 `.deb` package and follow the [Linux installation guide](https://github.com/charle-z/aeontra/blob/main/docs/install-edge-linux.md).

            Each platform includes checksums, signatures, SBOMs, and third-party notices. Verify the signed manifest before installation. The control-plane source, this signed release, an installed Edge, and real-device acceptance are separate identities.
        run: |
          release_dir="$RUNNER_TEMP/release/assets/$RELEASE"
          gh release create "$RELEASE" "$release_dir"/* "$RUNNER_TEMP/release/windows-assets"/* --target "$(git rev-parse HEAD)" --title "Aeontra Edge $RELEASE" --notes "$RELEASE_NOTES"
          if ! gh release view stable >/dev/null 2>&1; then
            gh release create stable --target "$(git rev-parse HEAD)" --title 'Aeontra Edge stable channel' --notes 'Mutable pointer containing only the currently signed stable channel metadata.'
          fi
          gh release upload stable --clobber "$RUNNER_TEMP/release/assets/stable/channel-amd64.json" "$RUNNER_TEMP/release/assets/stable/channel-amd64.json.sig"
          gh release upload stable --clobber "$RUNNER_TEMP/release/windows-assets/channel-windows-amd64.json" "$RUNNER_TEMP/release/windows-assets/channel-windows-amd64.json.sig"

      - name: Upload retained workflow evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: edge-release-${{ inputs.release }}-${{ github.sha }}
          path: ${{ runner.temp }}/release/assets
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build and verify signed Windows Edge bundle
    runs-on: windows-2025
    timeout-minutes: 30
    environment: edge-release
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run native Windows gates
        shell: pwsh
        run: |
          go test ./internal/bundle ./cmd/mcp-bundle-manifest ./cmd/mcp-release-channel ./cmd/mcp-bundle-updater -count=1
          go test ./internal/edgeclient ./cmd/mcp-edge -run 'Windows|CollectWindows|IsWindows' -count=1
          go vet ./...
          go build ./...
          git diff --check
          $errors = $null
          foreach ($script in @('packaging/windows/install-edge.ps1', 'packaging/windows/uninstall-edge.ps1', 'packaging/windows/new-deterministic-archive.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors)
            if ($errors.Count -ne 0) { throw "PowerShell syntax failed for $script" }
          }

      - name: Build minimal Windows signing executables
        shell: pwsh
        run: |
          $signerRoot = Join-Path $env:RUNNER_TEMP 'windows-release\signers'
          New-Item -ItemType Directory -Path $signerRoot -Force | Out-Null
          go build -trimpath -o (Join-Path $signerRoot 'mcp-bundle-manifest.exe') ./cmd/mcp-bundle-manifest
          go build -trimpath -o (Join-Path $signerRoot 'mcp-release-channel.exe') ./cmd/mcp-release-channel

      - name: Derive non-secret Windows release public key
        shell: pwsh
        env:
          EDGE_PRIVATE_KEY_B64: ${{ secrets.EDGE_BUNDLE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EDGE_PRIVATE_KEY_B64)) { throw 'missing signing identity' }
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'windows-release'
          $keyPath = Join-Path $releaseRoot 'edge.key'
          try {
            $key = [Convert]::FromBase64String($env:EDGE_PRIVATE_KEY_B64)
            if ($key.Length -ne 64) { throw 'invalid signing identity' }
            [IO.File]::WriteAllBytes($keyPath, $key)
            $publicKey = -join $key[32..63].ForEach({ $_.ToString('x2') })
            [IO.File]::WriteAllText((Join-Path $releaseRoot 'edge-public-key.hex'), "$publicKey`n", [Text.UTF8Encoding]::new($false))
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build unsigned Windows bundle
        shell: pwsh
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if ($env:RELEASE -notmatch '^(p15\.[0-9]+\.[0-9]+|v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$') { throw 'invalid release' }
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -ne (git rev-parse origin/main).Trim()) { throw 'release commit is not the exact main head' }
          $catalog = (go run ./cmd/mcp-catalog-id).Trim()
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'windows-release'
          $bundleRoot = Join-Path $releaseRoot 'bundle'
          $assetRoot = Join-Path $releaseRoot 'assets'
          New-Item -ItemType Directory -Path (Join-Path $bundleRoot 'bin'), $assetRoot -Force | Out-Null
          $publicKey = (Get-Content -LiteralPath (Join-Path $releaseRoot 'edge-public-key.hex') -Raw).Trim()
          [IO.File]::WriteAllText((Join-Path $releaseRoot 'commit.txt'), "$commit`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $releaseRoot 'catalog.txt'), "$catalog`n", [Text.UTF8Encoding]::new($false))
          $ldflags = "-s -w -X github.com/charle-z/mcp-devbox/internal/buildinfo.Commit=$commit -X github.com/charle-z/mcp-devbox/internal/buildinfo.EdgeBundleRelease=$env:RELEASE -X github.com/charle-z/mcp-devbox/internal/buildinfo.EdgeBundleCatalogHash=$catalog -X github.com/charle-z/mcp-devbox/internal/buildinfo.EdgeBundlePublicKey=$publicKey"
          go build -trimpath -buildvcs=false -ldflags $ldflags -o (Join-Path $bundleRoot 'bin\mcp-edge.exe') ./cmd/mcp-edge
          go build -trimpath -buildvcs=false -ldflags $ldflags -o (Join-Path $bundleRoot 'bin\mcp-bundle-updater.exe') ./cmd/mcp-bundle-updater
          Copy-Item packaging/windows/install-edge.ps1 (Join-Path $bundleRoot 'install-edge.ps1')
          Copy-Item packaging/windows/uninstall-edge.ps1 (Join-Path $bundleRoot 'uninstall-edge.ps1')

      - name: Sign Windows bundle manifest with isolated executable
        shell: pwsh
        env:
          EDGE_PRIVATE_KEY_B64: ${{ secrets.EDGE_BUNDLE_ED25519_PRIVATE_KEY_B64 }}
          RELEASE: ${{ inputs.release }}
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'windows-release'
          $keyPath = Join-Path $releaseRoot 'edge.key'
          try {
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:EDGE_PRIVATE_KEY_B64))
            if ((Get-Item -LiteralPath $keyPath).Length -ne 64) { throw 'invalid signing identity' }
            & (Join-Path $releaseRoot 'signers\mcp-bundle-manifest.exe') --root (Join-Path $releaseRoot 'bundle') --release $env:RELEASE --commit (Get-Content -LiteralPath (Join-Path $releaseRoot 'commit.txt') -Raw).Trim() --protocol mcp-devbox.edge-bundle.v1 --catalog (Get-Content -LiteralPath (Join-Path $releaseRoot 'catalog.txt') -Raw).Trim() --architecture amd64 --platform windows --manifest-version 6 --private-key $keyPath
            if ($LASTEXITCODE -ne 0) { throw 'Windows bundle manifest signing failed' }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build deterministic Windows archive
        shell: pwsh
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'windows-release'
          $bundleRoot = Join-Path $releaseRoot 'bundle'
          $assetRoot = Join-Path $releaseRoot 'assets'
          $archive = Join-Path $assetRoot "mcp-devbox-edge_$env:RELEASE`_windows_amd64.zip"
          $reproArchive = Join-Path $releaseRoot 'reproducible-check.zip'
          ./packaging/windows/new-deterministic-archive.ps1 -Root $bundleRoot -Output $archive
          ./packaging/windows/new-deterministic-archive.ps1 -Root $bundleRoot -Output $reproArchive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $reproArchive -Algorithm SHA256).Hash) { throw 'Windows archive is not reproducible' }
          Remove-Item -LiteralPath $reproArchive -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $assetRoot 'mcp-devbox-edge_windows_amd64.sha256'), "$hash  $([IO.Path]::GetFileName($archive))`n", [Text.UTF8Encoding]::new($false))

      - name: Sign stable Windows channel with isolated executable
        shell: pwsh
        env:
          EDGE_PRIVATE_KEY_B64: ${{ secrets.EDGE_BUNDLE_ED25519_PRIVATE_KEY_B64 }}
          RELEASE: ${{ inputs.release }}
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'windows-release'
          $keyPath = Join-Path $releaseRoot 'edge.key'
          try {
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:EDGE_PRIVATE_KEY_B64))
            if ((Get-Item -LiteralPath $keyPath).Length -ne 64) { throw 'invalid signing identity' }
            & (Join-Path $releaseRoot 'signers\mcp-release-channel.exe') --archive (Join-Path $releaseRoot "assets\mcp-devbox-edge_$env:RELEASE`_windows_amd64.zip") --output (Join-Path $releaseRoot 'assets') --release $env:RELEASE --commit (Get-Content -LiteralPath (Join-Path $releaseRoot 'commit.txt') -Raw).Trim() --protocol mcp-devbox.edge-bundle.v1 --catalog (Get-Content -LiteralPath (Join-Path $releaseRoot 'catalog.txt') -Raw).Trim() --architecture amd64 --platform windows --private-key $keyPath
            if ($LASTEXITCODE -ne 0) { throw 'Windows release channel signing failed' }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Remove Windows release signing identity
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'windows-release\edge.key'
          Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue

      - name: Generate Windows Edge SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ runner.temp }}/windows-release/bundle
          format: spdx-json
          output-file: ${{ runner.temp }}/windows-release/assets/mcp-devbox-edge_${{ inputs.release }}_windows_amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload retained Windows evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-edge-build-${{ github.sha }}
          path: ${{ runner.temp }}/windows-release/assets
          if-no-files-found: error
          retention-days: 30
