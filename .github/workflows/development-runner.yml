                              context.append(line); context_bytes[index] += len(line)
                          remaining[index] -= 1
                  preceding.append(line); preceding_bytes += len(line)
                  while len(preceding) > 32 or preceding_bytes > (4 << 10):
                      preceding_bytes -= len(preceding.popleft())
              def observe(chunk):
                  nonlocal pending, discarding, oversized
                  parts = chunk.split(b'\n')
                  for index, part in enumerate(parts):
                      ended = index < len(parts) - 1
                      if not discarding:
                          if len(pending) + len(part) > 65536:
                              pending, discarding = b'', True
                              oversized += 1
                          else: pending += part
