name: Aeontra isolated development runner
run-name: aeontra-development-${{ inputs.effect_id }}-${{ inputs.plan_digest }}-${{ inputs.execution_digest }}

on:
  workflow_dispatch:
    inputs:
      effect_id: {required: true, type: string}
      plan_digest: {required: true, type: string}
      source_owner: {required: true, type: string}
      source_repo: {required: true, type: string}
      source_sha: {required: true, type: string}
      command_profile: {required: true, type: choice, options: [probe-only, make-validate-all, go-test-all]}
      workflow_sha: {required: true, type: string}
      workflow_id: {required: true, type: string}
      execution_digest: {required: true, type: string}

# No production environment, deployment permission, OIDC permission or secrets.
# Standard public-repository hosted VM only; not ubuntu-slim or a paid label.
permissions:
  contents: read
concurrency:
  group: development-runner-${{ inputs.effect_id }}
  cancel-in-progress: false

jobs:
  execution:
    name: Isolated development execution
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EFFECT_ID: ${{ inputs.effect_id }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
      SOURCE_OWNER: ${{ inputs.source_owner }}
      SOURCE_REPO: ${{ inputs.source_repo }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      COMMAND_PROFILE: ${{ inputs.command_profile }}
      WORKFLOW_SHA: ${{ inputs.workflow_sha }}
      WORKFLOW_ID: ${{ inputs.workflow_id }}
      EXECUTION_DIGEST: ${{ inputs.execution_digest }}
    steps:
      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$WORKFLOW_SHA"
          [[ "$EFFECT_ID" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PLAN_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          [[ "$WORKFLOW_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$EXECUTION_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          case "$COMMAND_PROFILE" in probe-only|make-validate-all|go-test-all) ;; *) exit 1 ;; esac
          # Bind the title to actual inputs; an asserted digest is not evidence.
          python3 - <<'PYTHON'
          import hashlib, json, os, struct
          with open(os.environ['GITHUB_EVENT_PATH'], 'rb') as event_file:
              event = json.load(event_file)
          repository = event.get('repository') if isinstance(event, dict) else None
          if (not isinstance(repository, dict) or repository.get('private') is not False
                  or repository.get('full_name') != os.environ['GITHUB_REPOSITORY']):
              raise SystemExit('runner repository must be the exact public repository')
          digest = hashlib.sha256(b'aeontra-development-runner-execution-v1\x00')
          for name in ('EFFECT_ID', 'PLAN_DIGEST', 'SOURCE_OWNER', 'SOURCE_REPO',
                       'SOURCE_SHA', 'COMMAND_PROFILE', 'WORKFLOW_SHA', 'WORKFLOW_ID'):
              value = os.environ[name].encode('utf-8')
              digest.update(struct.pack('>I', len(value)))
              digest.update(value)
          if digest.hexdigest() != os.environ['EXECUTION_DIGEST']:
              raise SystemExit('execution input binding mismatch')
          PYTHON
          if test "$COMMAND_PROFILE" = probe-only; then
            test "$SOURCE_OWNER/$SOURCE_REPO" = "$GITHUB_REPOSITORY"
            test "$SOURCE_SHA" = "$WORKFLOW_SHA"
          fi

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: false

      - name: Stage trusted CI runtime adapter
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir .aeontra-runner-ci
          printf '%s\n' 'name: Trusted CI runtime adapter' 'description: Stage only ephemeral Actions cache authority' 'runs:' '  using: node24' '  main: index.js' >.aeontra-runner-ci/action.yml
          cat >.aeontra-runner-ci/index.js <<'JAVASCRIPT'
          const fs = require('fs');
          const names = ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RUNTIME_URL', 'ACTIONS_RESULTS_URL'];
          const values = {};
          for (const name of names) {
            if (!process.env[name]) throw new Error('ephemeral CI runtime contract missing');
            values[name] = process.env[name];
          }
          for (const name of ['ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
            if (process.env[name]) values[name] = process.env[name];
          }
          for (const name of ['GITHUB_REF', 'GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT']) {
            if (process.env[name]) values[name] = process.env[name];
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/aeontra-ci.json', JSON.stringify(values), {mode: 0o600, flag: 'wx'});
          JAVASCRIPT

      - name: Capture scoped CI runtime
        uses: ./.aeontra-runner-ci

      - name: Prepare disposable VM
        shell: bash
        run: |
          set -euo pipefail
          # Fixed VM-only setup. It never changes an Edge/VPS host.
          sudo install -d -m 0700 /opt/aeontra-control
          sudo install -m 0600 "$RUNNER_TEMP/aeontra-ci.json" /opt/aeontra-control/ci.json
          rm "$RUNNER_TEMP/aeontra-ci.json"
          sudo chmod 0700 "$RUNNER_WORKSPACE" "$RUNNER_TEMP" "$HOME"
          sudo systemctl stop docker.service docker.socket
          sudo useradd --no-create-home --home-dir /home/aeontra-workload --shell /bin/bash aeontra-workload
          # Host /home may carry a controller-UID default ACL. Clear inheritance
          # only on this newly created empty root, before any source or storage.
          sudo python3 - <<'FRESH_WORKLOAD_HOME'
          import errno, os, pwd, stat
          ACL_NAMES = ('system.posix_acl_access', 'system.posix_acl_default')
          def acl_absent(fd):
              for name in ACL_NAMES:
                  try: os.getxattr(fd, name)
                  except OSError as error:
                      if error.errno == errno.ENODATA: continue
                      raise
                  raise RuntimeError('fresh workload home retained an ACL')
          def prepare_home(parent, leaf, uid, gid):
              if (not leaf or leaf in ('.', '..') or '/' in leaf or uid <= 0 or gid <= 0):
                  raise ValueError('invalid fresh workload home identity')
              parent_fd = os.open(parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  # EEXIST is fatal, including an existing directory or symlink.
                  os.mkdir(leaf, 0o700, dir_fd=parent_fd)
                  fd = os.open(leaf, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=parent_fd)
                  try:
                      created = os.fstat(fd)
                      def verify(owner, group):
                          observed = os.fstat(fd)
                          entry = os.stat(leaf, dir_fd=parent_fd, follow_symlinks=False)
                          if (not stat.S_ISDIR(entry.st_mode) or
                                  (observed.st_dev, observed.st_ino) != (created.st_dev, created.st_ino) or
                                  (entry.st_dev, entry.st_ino) != (created.st_dev, created.st_ino) or
                                  observed.st_uid != owner or observed.st_gid != group or
                                  stat.S_IMODE(observed.st_mode) != 0o700 or os.listdir(fd)):
                              raise RuntimeError('fresh workload home changed')
                      verify(os.geteuid(), created.st_gid)
                      for name in ACL_NAMES:
                          try: os.removexattr(fd, name)
                          except OSError as error:
                              if error.errno != errno.ENODATA: raise
                      os.fchmod(fd, 0o700)
                      acl_absent(fd)
                      verify(os.geteuid(), created.st_gid)
                      os.fchown(fd, uid, gid)
                      verify(uid, gid)
                      acl_absent(fd)
                  finally: os.close(fd)
              finally: os.close(parent_fd)
          if __name__ == '__main__':
              account = pwd.getpwnam('aeontra-workload')
              prepare_home('/home', 'aeontra-workload', account.pw_uid, account.pw_gid)
          FRESH_WORKLOAD_HOME
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends uidmap dbus-user-session slirp4netns=1.2.1-1build2
          # Ubuntu's AppArmor unprivileged-userns restriction is changed only in
          # this disposable VM; the subsequent nested mount probe is mandatory.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          # runc detects the user-bus owner through real process cgroup metadata.
          # Exempt only this fixed workload group from hidepid metadata filtering;
          # cross-UID ptrace/DAC still deny controller secrets and are probed below.
          workload_gid="$(id -g aeontra-workload)"
          test "$workload_gid" -gt 0
          test "$workload_gid" != "$(id -g)"
          test "$(id -G aeontra-workload)" = "$workload_gid"
          sudo mount -o "remount,hidepid=2,gid=$workload_gid" /proc
          grep -Eq '^aeontra-workload:[0-9]+:[0-9]+$' /etc/subuid
          grep -Eq '^aeontra-workload:[0-9]+:[0-9]+$' /etc/subgid
          work="$(mktemp -d)"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --max-time 300 -o "$work/docker.tgz" https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz
          printf '%s  %s\n' d8db66739d2e28d4933786d73e918d9be643a67fbd835db1bf740d650a259e70 "$work/docker.tgz" | sha256sum --check --status
          tar -xzf "$work/docker.tgz" -C "$work"
          sudo install -d -m 0755 /opt/aeontra-bin
          sudo install -m 0755 "$work"/docker/* /opt/aeontra-bin/
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --max-time 300 -o "$work/buildx" https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-amd64
          printf '%s  %s\n' 9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b "$work/buildx" | sha256sum --check --status
          sudo install -d -m 0755 /usr/local/lib/docker/cli-plugins
          sudo install -m 0755 "$work/buildx" /usr/local/lib/docker/cli-plugins/docker-buildx
          # Pin the checksum manifest itself, then verify the release archive.
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --max-time 300 -o "$work/SHA256SUMS" https://github.com/rootless-containers/rootlesskit/releases/download/v2.3.5/SHA256SUMS
          printf '%s  %s\n' 35c4618e1e9a5cb2aaea08edbba6e3de5bbeedd00a65fcf7d14f31fc942a7655 "$work/SHA256SUMS" | sha256sum --check --status
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --max-time 300 -o "$work/rootlesskit-x86_64.tar.gz" https://github.com/rootless-containers/rootlesskit/releases/download/v2.3.5/rootlesskit-x86_64.tar.gz
          (cd "$work" && grep '  rootlesskit-x86_64.tar.gz$' SHA256SUMS | sha256sum --check --status)
          tar -xzf "$work/rootlesskit-x86_64.tar.gz" -C "$work" rootlesskit
          sudo install -m 0755 "$work/rootlesskit" /opt/aeontra-bin/rootlesskit
          sudo install -d -o aeontra-workload -g aeontra-workload -m 0700 /home/aeontra-workload/runtime
          sudo install -d -m 0755 /opt/aeontra-go
          sudo cp -a "$(go env GOROOT)/." /opt/aeontra-go/
          sudo chown -R root:root /opt/aeontra-go
          sudo chmod -R go-w /opt/aeontra-go
          # RootlessKit copy-up preserves host /run entries as symlinks. Unlink
          # only these namespace-local entries, never their host targets.
          sudo tee /opt/aeontra-bin/rootless-child.py >/dev/null <<'ROOTLESS_CHILD'
          import os
          with open('/proc/self/uid_map') as mappings:
              first = mappings.readline().split()
          if len(first) != 3 or first[0] != '0' or int(first[1]) <= 0 or first[2] != '1':
              raise SystemExit('rootless child user namespace missing')
          with open('/proc/self/mountinfo') as mounts:
              copied_run = any(len(parts := line.split()) > 6 and parts[4] == '/run'
                               and ' - tmpfs ' in line for line in mounts)
          if not copied_run:
              raise SystemExit('rootless child copied-up runtime missing')
          for name in ('docker', 'containerd', 'xtables.lock'):
              path = '/run/' + name
              if os.path.islink(path):
                  os.unlink(path)
              elif os.path.lexists(path):
                  raise SystemExit('unexpected rootless runtime entry')
          os.execv('/opt/aeontra-bin/dockerd', ['/opt/aeontra-bin/dockerd', '--rootless',
                   '--host=unix:///home/aeontra-workload/runtime/docker.sock',
                   '--data-root=/home/aeontra-workload/docker',
                   '--exec-root=/home/aeontra-workload/runtime/dockerd'])
          ROOTLESS_CHILD
          sudo chmod 0755 /opt/aeontra-bin/rootless-child.py
          # Docker inspect has no raw ACL reader. This fixed diagnostic reads
          # only workload storage and one read-only image subpath; it never
          # executes an image's binaries or supplies receipt evidence.
          sudo tee /opt/aeontra-bin/runner-acl-diagnostics.py >/dev/null <<'ACL_DIAGNOSTICS'
          #!/usr/bin/python3
          import errno, json, os, pwd, re, stat, struct, subprocess, sys
          budget = 3800
          def emit(value):
              global budget
              line = json.dumps(value, separators=(',', ':'), ensure_ascii=True)
              if len(line) > 1000:
                  line = '{"diagnostic_error":"oversized diagnostic record"}'
              if len(line) + 1 <= budget:
                  print(line, flush=True)
                  budget -= len(line) + 1
          def decode_acl(raw):
              if len(raw) < 4 or len(raw) > 256 or (len(raw) - 4) % 8 or struct.unpack_from('<I', raw)[0] != 2:
                  raise ValueError('invalid or oversized ACL')
              tags = {1: 'owner', 2: 'user', 4: 'group_owner', 8: 'group', 16: 'mask', 32: 'other'}
              entries = []
              for offset in range(4, len(raw), 8):
                  tag, perm, identifier = struct.unpack_from('<HHI', raw, offset)
                  if tag not in tags or perm > 7:
                      raise ValueError('invalid ACL entry')
                  entries.append([tags[tag], identifier if tag in (2, 8) else None, perm])
              return {'raw_hex': raw.hex(), 'entries': entries,
                      'unmapped_named_id': any(entry[0] in ('user', 'group') and entry[1] == 4294967295 for entry in entries)}
          def read_map(path):
              with open(path) as source:
                  data = source.read(4097)
              if len(data) > 4096:
                  raise ValueError('oversized namespace map')
              mappings = [list(map(int, line.split())) for line in data.splitlines()]
              if not mappings or any(len(row) != 3 or min(row) < 0 or row[2] == 0 for row in mappings):
                  raise ValueError('invalid namespace map')
              return mappings
          def inspect_fd(fd, label, require_owner=True):
              observed = os.fstat(fd)
              if not stat.S_ISDIR(observed.st_mode) or (require_owner and observed.st_uid != os.getuid()):
                  raise ValueError('diagnostic directory ownership mismatch')
              emit({'directory': label, 'uid': observed.st_uid, 'gid': observed.st_gid, 'mode': oct(stat.S_IMODE(observed.st_mode))})
              for name in ('system.posix_acl_access', 'system.posix_acl_default'):
                  try:
                      raw = os.getxattr(fd, name)
                      emit({'directory': label, 'xattr': name, **decode_acl(raw)})
                  except OSError as error:
                      emit({'directory': label, 'xattr': name, 'errno': error.errno})
                      if error.errno not in (errno.ENODATA, errno.ENOTSUP):
                          raise
                  except ValueError:
                      emit({'directory': label, 'xattr': name, 'error': 'invalid or oversized ACL'})
                      raise
          def inspect_storage():
              # Walk every component without following a workload-supplied link.
              fd = os.open('/home', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  for name, label in (('aeontra-workload', 'workload-home'), ('docker', 'docker-data-root')):
                      child = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                      os.close(fd)
                      fd = child
                      inspect_fd(fd, label)
              finally:
                  os.close(fd)
          def docker(*argv):
              result = subprocess.run(['/opt/aeontra-bin/docker', *argv], capture_output=True, timeout=10)
              if result.returncode or len(result.stdout) > 16384:
                  emit({'docker_diagnostic': argv[0], 'exit_code': result.returncode, 'stdout_bytes': len(result.stdout)})
                  raise RuntimeError('bounded Docker diagnostic unavailable')
              return result.stdout.decode('utf-8', errors='strict').strip()
          def reader(pid, initial_namespace):
              mappings = read_map('/proc/self/uid_map')
              namespace = os.stat('/proc/self/ns/user').st_ino
              if namespace == initial_namespace or namespace != os.stat('/proc/' + str(pid) + '/ns/user').st_ino:
                  raise ValueError('reader did not enter the holder namespace')
              emit({'reader': 'image-tmp-rootless', 'uid_map': mappings, 'gid_map': read_map('/proc/self/gid_map')})
              # This is the kernel root reference of our fixed BusyBox holder,
              # not a repository-supplied path. The final image directory may
              # not be a symlink. nsenter itself runs only as the workload UID.
              fd = os.open('/proc/' + str(pid) + '/root/image-tmp', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  inspect_fd(fd, 'buildkit-tests-tmp-rootless', require_owner=False)
              finally:
                  os.close(fd)
          def main():
              if len(sys.argv) == 4 and sys.argv[1] == '--reader' and sys.argv[2].isdigit() and sys.argv[3].isdigit():
                  reader(int(sys.argv[2]), int(sys.argv[3]))
                  return
              if len(sys.argv) != 1 or os.getuid() != pwd.getpwnam('aeontra-workload').pw_uid or os.getuid() == 0:
                  raise ValueError('diagnostic must run as workload')
              emit({'reader': 'workload', 'uid_map': read_map('/proc/self/uid_map'), 'gid_map': read_map('/proc/self/gid_map')})
              inspect_storage()
              info_format = '{"server_version":{{json .ServerVersion}},"driver":{{json .Driver}},"driver_status":{{json .DriverStatus}},"kernel":{{json .KernelVersion}},"cgroup_driver":{{json .CgroupDriver}},"security_options":{{json .SecurityOptions}}}'
              emit({'docker_info': json.loads(docker('info', '--format', info_format))})
              image = docker('image', 'inspect', 'buildkit-tests', '--format', '{{.Id}}')
              if not re.fullmatch(r'sha256:[a-f0-9]{64}', image):
                  raise ValueError('invalid diagnostic image identity')
              emit({'image': image})
              cid = docker('run', '--detach', '--rm', '--pull=never', '--network=none', '--read-only', '--memory=64m', '--pids-limit=16', '--user=0:0',
                  '--mount', 'type=image,src=' + image + ',dst=/image-tmp,image-subpath=tmp',
                  'busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0', '/bin/sleep', '45')
              if not re.fullmatch(r'[a-f0-9]{64}', cid):
                  raise ValueError('invalid diagnostic holder identity')
              try:
                  pid_text = docker('inspect', '--format', '{{.State.Pid}}', cid)
                  if not pid_text.isdigit() or int(pid_text) <= 0:
                      raise ValueError('invalid diagnostic holder process')
                  pid = int(pid_text)
                  with open('/proc/' + str(pid) + '/status') as status:
                      owner = next((int(line.split()[1]) for line in status if line.startswith('Uid:')), None)
                  if owner != os.getuid():
                      raise ValueError('diagnostic holder ownership mismatch')
                  fd = os.open('/proc/' + str(pid) + '/root/image-tmp', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                  try:
                      inspect_fd(fd, 'buildkit-tests-tmp-initial', require_owner=False)
                  finally:
                      os.close(fd)
                  initial_namespace = os.stat('/proc/self/ns/user').st_ino
                  result = subprocess.run(['/usr/bin/nsenter', '--target', str(pid), '--user', '--preserve-credentials', '--',
                      '/usr/bin/python3', '/opt/aeontra-bin/runner-acl-diagnostics.py', '--reader', str(pid), str(initial_namespace)], capture_output=True, timeout=10)
                  if result.returncode or len(result.stdout) > 3800:
                      raise RuntimeError('rootless ACL reader unavailable')
                  for line in result.stdout.decode('utf-8', errors='strict').splitlines():
                      emit(json.loads(line))
              finally:
                  docker('rm', '--force', cid)
          if __name__ == '__main__':
              try:
                  main()
              except (OSError, ValueError, RuntimeError, subprocess.TimeoutExpired) as error:
                  emit({'diagnostic_error': type(error).__name__, 'errno': getattr(error, 'errno', None)})
                  raise SystemExit(1)
          ACL_DIAGNOSTICS
          sudo chmod 0755 /opt/aeontra-bin/runner-acl-diagnostics.py
          workload_uid="$(id -u aeontra-workload)"
          # Bound the manager ancestor, including Docker's sibling scopes.
          sudo install -d -m 0755 "/etc/systemd/system/user@${workload_uid}.service.d"
          sudo tee "/etc/systemd/system/user@${workload_uid}.service.d/aeontra.conf" >/dev/null <<'MANAGER'
          [Service]
          Delegate=cpu cpuset io memory pids
          MemoryMax=10G
          TasksMax=4096
          MANAGER
          sudo install -d -m 0755 /etc/systemd/user
          sudo tee /etc/systemd/user/aeontra-rootless.service >/dev/null <<'UNIT'
          [Unit]
          Requires=dbus.socket
          After=dbus.socket
          [Service]
          Delegate=yes
          KillMode=control-group
          MemoryMax=10G
          TasksMax=4096
          TimeoutStopSec=30
          ExecStart=/usr/bin/env -i HOME=/home/aeontra-workload PATH=/opt/aeontra-bin:/usr/bin:/bin:/usr/sbin:/sbin XDG_CONFIG_HOME=/home/aeontra-workload/.config XDG_DATA_HOME=/home/aeontra-workload/.local/share XDG_CACHE_HOME=/home/aeontra-workload/.cache XDG_RUNTIME_DIR=%t DBUS_SESSION_BUS_ADDRESS=unix:path=%t/bus /opt/aeontra-bin/rootlesskit --net=slirp4netns --port-driver=builtin --disable-host-loopback --copy-up=/etc --copy-up=/run --propagation=rslave /usr/bin/python3 /opt/aeontra-bin/rootless-child.py
          UNIT
          sudo systemctl daemon-reload
          sudo loginctl enable-linger aeontra-workload
          sudo systemctl start "user@${workload_uid}.service"
          test "$(stat -c %u /run/user/"$workload_uid")" = "$workload_uid"
          test "$(stat -c %a /run/user/"$workload_uid")" = 700
          sudo -u aeontra-workload env -i HOME=/home/aeontra-workload PATH=/usr/bin:/bin XDG_RUNTIME_DIR="/run/user/$workload_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$workload_uid/bus" systemctl --user start aeontra-rootless.service
          # Trusted executor drops supplementary groups and UID before every
          # child. Output cannot inject runner commands or alter GITHUB_OUTPUT.
          sudo tee /opt/aeontra-control/execute.py >/dev/null <<'PYTHON'
          import json, os, pwd, subprocess, sys
          workload_uid = pwd.getpwnam('aeontra-workload').pw_uid
          env = {'HOME': '/home/aeontra-workload', 'PATH': '/opt/aeontra-bin:/opt/aeontra-go/bin:/usr/bin:/bin:/usr/sbin:/sbin',
                 'XDG_RUNTIME_DIR': '/run/user/' + str(workload_uid), 'DOCKER_HOST': 'unix:///home/aeontra-workload/runtime/docker.sock',
                 'XDG_CONFIG_HOME': '/home/aeontra-workload/.config', 'XDG_DATA_HOME': '/home/aeontra-workload/.local/share',
                 'XDG_CACHE_HOME': '/home/aeontra-workload/.cache',
                 'DBUS_SESSION_BUS_ADDRESS': 'unix:path=/run/user/' + str(workload_uid) + '/bus',
                 'DOCKER_CONFIG': '/home/aeontra-workload/.docker', 'GITHUB_ACTIONS': 'true',
                 'GOTOOLCHAIN': 'local', 'GOENV': 'off'}
          diagnostic = sys.argv[2] == 'acl-diagnostics'
          if diagnostic:
              if sys.argv[1:] != ['acl-diagnostics', 'acl-diagnostics']:
                  raise ValueError('invalid fixed diagnostic invocation')
              env.pop('GITHUB_ACTIONS')
          else:
              env.update(json.load(open('/opt/aeontra-control/ci.json')))
          with open('/opt/aeontra-control/runtime.env', 'w') as f:
              for key, value in env.items():
                  if '\n' in value or '\r' in value: raise ValueError('invalid private environment')
                  f.write(key + '=' + '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"\n')
          os.chmod('/opt/aeontra-control/runtime.env', 0o600)
          executable = {'docker': '/opt/aeontra-bin/docker', 'go': '/opt/aeontra-go/bin/go', 'make': '/usr/bin/make',
                        'acl-diagnostics': '/opt/aeontra-bin/runner-acl-diagnostics.py'}.get(sys.argv[2])
          if not executable: raise ValueError('unregistered executable')
          with open('/opt/aeontra-control/' + sys.argv[1] + '.log', 'wb') as log:
              argv = ['/usr/bin/systemd-run', '--quiet', '--wait', '--pipe', '--collect',
                      '--unit=aeontra-' + sys.argv[1], '--service-type=exec',
                      '-p', 'User=aeontra-workload', '-p', 'Group=aeontra-workload',
                      '-p', 'Delegate=yes', '-p', 'KillMode=control-group', '-p', 'MemoryMax=10G',
                      '-p', 'TasksMax=4096', '-p', 'RuntimeMaxSec=' + ('60' if diagnostic else '4200'),
                      '-p', 'EnvironmentFile=/opt/aeontra-control/runtime.env',
                      '--working-directory=/home/aeontra-workload/source', executable] + sys.argv[3:]
              child = subprocess.Popen(argv, env={'PATH': '/usr/bin:/bin'},
                                       stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              retained = 0
              while True:
                  chunk = child.stdout.read(65536)
                  if not chunk: break
                  keep = min(len(chunk), max(0, (16 << 20) - retained))
                  log.write(chunk[:keep]); retained += keep
              status = child.wait(timeout=15)
          sys.exit(status)
          PYTHON
          sudo chmod 0600 /opt/aeontra-control/execute.py

      - name: Fetch exact public Git objects
        shell: bash
        run: |
          set -euo pipefail
          # Credential-free Git transport, not command-output reconstruction.
          sudo env -i PATH=/usr/bin:/bin HOME=/opt/aeontra-control git -c core.hooksPath=/dev/null init /home/aeontra-workload/source
          sudo env -i PATH=/usr/bin:/bin HOME=/opt/aeontra-control git -C /home/aeontra-workload/source -c core.hooksPath=/dev/null remote add origin "https://github.com/$SOURCE_OWNER/$SOURCE_REPO.git"
          sudo env -i PATH=/usr/bin:/bin HOME=/opt/aeontra-control GIT_TERMINAL_PROMPT=0 git -C /home/aeontra-workload/source -c core.hooksPath=/dev/null fetch --no-tags origin "$SOURCE_SHA"
          sudo env -i PATH=/usr/bin:/bin HOME=/opt/aeontra-control git -C /home/aeontra-workload/source -c core.hooksPath=/dev/null checkout --detach "$SOURCE_SHA"
          test "$(sudo git -C /home/aeontra-workload/source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sudo git -C /home/aeontra-workload/source rev-parse --is-shallow-repository)" = false
          sudo chown -R aeontra-workload:aeontra-workload /home/aeontra-workload/source

      - name: Probe kernel and CI contracts (Go 1.26.8)
        shell: bash
        run: |
          set -euo pipefail
          # Real cross-UID checks, including mapped namespace root. Fixtures have
          # no actual credential values; failures never print a private read.
          sudo test -f /opt/aeontra-control/ci.json
          python3 - <<'CONTROLLER_ISOLATION'
          import os, subprocess, tempfile
          probe = r'''
          import ctypes, errno, os, sys
          pid, controller_uid, private_file, private_home = sys.argv[1:]
          with open('/proc/1/cgroup') as metadata:
              if not metadata.read(): raise SystemExit('init cgroup metadata unavailable')
          with open('/proc/sys/kernel/overflowuid') as overflow:
              expected_uid = int(overflow.read())
          with open('/proc/self/uid_map') as mappings:
              for mapping in mappings:
                  inside, outside, length = map(int, mapping.split())
                  if outside <= int(controller_uid) < outside + length:
                      expected_uid = inside + int(controller_uid) - outside
                      break
          with open('/proc/' + pid + '/status') as status:
              observed_uid = next((int(line.split()[1]) for line in status if line.startswith('Uid:')), None)
              if observed_uid != expected_uid:
                  raise SystemExit('controller sentinel identity changed')
          def denied(operation):
              try: operation()
              except PermissionError: return
              raise SystemExit('controller isolation violation')
          for name in ('environ', 'mem', 'maps'):
              denied(lambda: os.close(os.open('/proc/' + pid + '/' + name, os.O_RDONLY)))
          for name in ('fd', 'root', 'cwd', 'exe'):
              path = '/proc/' + pid + '/' + name
              denied(lambda: os.listdir(path) if name == 'fd' else os.readlink(path))
          for path in (private_file, '/opt/aeontra-control/ci.json', '/opt/aeontra-control/execute.py'):
              denied(lambda: os.close(os.open(path, os.O_RDONLY)))
          denied(lambda: os.listdir(private_home))
          denied(lambda: os.close(os.open('/opt/aeontra-control/isolation-write-probe', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)))
          libc = ctypes.CDLL(None, use_errno=True)
          if libc.ptrace(0x4206, int(pid), None, None) != -1 or ctypes.get_errno() != errno.EPERM:
              raise SystemExit('controller ptrace isolation violation')
          '''
          with tempfile.NamedTemporaryFile(dir=os.environ['RUNNER_TEMP']) as private_file:
              sentinel = subprocess.Popen(['/usr/bin/sleep', '120'], cwd=os.environ['HOME'],
                  env={'AEONTRA_CONTROLLER_SENTINEL': 'nonsecret-isolation-fixture'},
                  stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              try:
                  def live_controller():
                      if sentinel.poll() is not None: raise SystemExit('controller sentinel exited')
                      with open('/proc/' + str(sentinel.pid) + '/status') as status:
                          uid = next((int(line.split()[1]) for line in status if line.startswith('Uid:')), None)
                          if uid != os.getuid(): raise SystemExit('controller sentinel identity changed')
                  for namespace in (False, True):
                      live_controller()
                      argv = ['/usr/bin/sudo', '/usr/sbin/runuser', '-u', 'aeontra-workload', '--',
                              '/usr/bin/env', '-i', 'PATH=/usr/bin:/bin']
                      if namespace: argv += ['/usr/bin/unshare', '--user', '--map-root-user']
                      argv += ['/usr/bin/python3', '-c', probe, str(sentinel.pid), str(os.getuid()),
                               private_file.name, os.environ['HOME']]
                      subprocess.run(argv, check=True, timeout=15)
                      live_controller()
              finally:
                  sentinel.terminate()
                  sentinel.wait(timeout=5)
          print('Controller credential and ptrace isolation verified for workload and namespace root')
          CONTROLLER_ISOLATION
          workload_uid="$(id -u aeontra-workload)"
          # Use real bus credentials in the same UID mapping as runc, not a
          # manufactured OwnerUID or permission to use the system bus.
          sudo -u aeontra-workload env -i HOME=/home/aeontra-workload PATH=/usr/bin:/bin XDG_RUNTIME_DIR="/run/user/$workload_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$workload_uid/bus" timeout 10s unshare --user --map-root-user busctl --user --no-pager status | sed 's/^[[:space:]]*//' | grep -Fx "OwnerUID=$workload_uid"
          sudo runuser -u aeontra-workload -- unshare --user --map-root-user --mount --pid --fork sh -eu -c 'unshare --user --map-root-user --mount --pid --fork sh -eu -c "mount -t proc proc /proc; test -r /proc/self/status"'
          for attempt in $(seq 1 30); do
            if sudo python3 /opt/aeontra-control/execute.py docker-info docker info; then break; fi
            if test "$attempt" = 30; then exit 1; fi
            sleep 1
          done
          sudo grep -q rootless /opt/aeontra-control/docker-info.log
          sudo grep -Eq '^ Cgroup Driver: systemd$' /opt/aeontra-control/docker-info.log
          sudo grep -Eq '^ Cgroup Version: 2$' /opt/aeontra-control/docker-info.log
          sudo python3 /opt/aeontra-control/execute.py workspace-bind docker run --rm --memory 256m --pids-limit 64 --mount type=bind,src=/home/aeontra-workload/source,dst=/workspace,readonly busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0 sh -eu -c 'test "$(cat /sys/fs/cgroup/memory.max)" = 268435456; test "$(cat /sys/fs/cgroup/pids.max)" = 64; cat /workspace/.git/HEAD'
          sudo grep -Fx "$SOURCE_SHA" /opt/aeontra-control/workspace-bind.log
          # Exercise image-to-volume xattr copying, not only workspace binds.
          sudo python3 /opt/aeontra-control/execute.py volume-copy docker run --rm --pull=never --network=none --read-only --memory 256m --pids-limit 64 --mount type=volume,dst=/tmp busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0 sh -eu -c 'test "$(cat /sys/fs/cgroup/memory.max)" = 268435456; test "$(cat /sys/fs/cgroup/pids.max)" = 64; printf "%s\n" volume-copy-verified > /tmp/aeontra-proof; cat /tmp/aeontra-proof'
          sudo grep -Fx volume-copy-verified /opt/aeontra-control/volume-copy.log
          workload_uid="$(id -u aeontra-workload)"
          user_systemctl=(sudo -u aeontra-workload env -i HOME=/home/aeontra-workload PATH=/usr/bin:/bin XDG_RUNTIME_DIR="/run/user/$workload_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$workload_uid/bus" systemctl --user)
          "${user_systemctl[@]}" show aeontra-rootless.service --property=Delegate --value | grep -Fx yes
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          cgroup="$("${user_systemctl[@]}" show aeontra-rootless.service --property=ControlGroup --value)"
          test "$cgroup" = "/user.slice/user-${workload_uid}.slice/user@${workload_uid}.service/app.slice/aeontra-rootless.service"
          manager_cgroup="/sys/fs/cgroup/user.slice/user-${workload_uid}.slice/user@${workload_uid}.service"
          test "$(sudo cat "$manager_cgroup/memory.max")" = 10737418240
          test "$(sudo cat "$manager_cgroup/pids.max")" = 4096
          sudo runuser -u aeontra-workload -- sh -eu -c 'test -w "$1/cgroup.procs"; test -w "$1/cgroup.subtree_control"' sh "/sys/fs/cgroup$cgroup"
          # Real nested runc/proc execution and GitHub cache export/import. No
          # capability is inferred merely from the runs-on label or env names.
          sudo install -d -o aeontra-workload -g aeontra-workload -m 0700 /home/aeontra-workload/probe
          printf '%s\n' 'FROM busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0' 'RUN test -r /proc/self/status && echo measured > /proof' | sudo tee /home/aeontra-workload/probe/Dockerfile >/dev/null
          sudo chown aeontra-workload:aeontra-workload /home/aeontra-workload/probe/Dockerfile
          buildkit_image=moby/buildkit:v0.31.2-ubuntu@sha256:50cccfc001857e9e198d41632c0c2ca5a43ec5d0bf8f01335edab2c42215c9ae
          sudo python3 /opt/aeontra-control/execute.py builder-export docker buildx create --name measured-export --driver docker-container --driver-opt "image=$buildkit_image" --use
          sudo python3 /opt/aeontra-control/execute.py cache-export docker buildx build --progress=plain --cache-to "type=gha,version=2,scope=$EFFECT_ID,mode=max" --output type=cacheonly /home/aeontra-workload/probe
          sudo python3 /opt/aeontra-control/execute.py builder-remove docker buildx rm measured-export
          sudo python3 /opt/aeontra-control/execute.py builder-import docker buildx create --name measured-import --driver docker-container --driver-opt "image=$buildkit_image" --use
          sudo python3 /opt/aeontra-control/execute.py cache-import docker buildx build --progress=plain --cache-from "type=gha,version=2,scope=$EFFECT_ID" --output type=cacheonly /home/aeontra-workload/probe
          sudo grep -q CACHED /opt/aeontra-control/cache-import.log
          sudo python3 /opt/aeontra-control/execute.py pinned-go go version
          sudo grep -Fx 'go version go1.26.8 linux/amd64' /opt/aeontra-control/pinned-go.log
          sudo python3 /opt/aeontra-control/execute.py make make --version

      - name: Execute exact profile
        id: exact-command
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND_PROFILE" in
            probe-only) sudo install -m 0600 /dev/null /opt/aeontra-control/command.log ;;
            make-validate-all) sudo python3 /opt/aeontra-control/execute.py command make validate-all ;;
            go-test-all) sudo python3 /opt/aeontra-control/execute.py command go test ./... -count=1 ;;
            *) exit 1 ;;
          esac

      - name: Inspect rootless storage ACL after exact make failure
        if: ${{ !cancelled() && steps.exact-command.outcome == 'failure' && inputs.command_profile == 'make-validate-all' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 /opt/aeontra-control/execute.py acl-diagnostics acl-diagnostics

      - name: Bind trusted receipt
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's exact-run job/step metadata is the broker receipt source.
          # Repository-controlled files/logs/artifacts are never attestation.
          workload_uid="$(id -u aeontra-workload)"
          sudo -u aeontra-workload env -i HOME=/home/aeontra-workload PATH=/usr/bin:/bin XDG_RUNTIME_DIR="/run/user/$workload_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$workload_uid/bus" systemctl --user stop aeontra-rootless.service
          sudo test -f /opt/aeontra-control/command.log
          sudo test ! -L /opt/aeontra-control/command.log
          printf '%s\n' 'Exact command completed; semantic acceptance remains separate.'

      - name: Bounded untrusted command diagnostics
        if: always()
        shell: bash
        run: |
          if sudo test -d /opt/aeontra-control; then
            if ! sudo bash -o pipefail -c 'umask 077; journalctl --no-pager --lines=40 --output=cat _SYSTEMD_USER_UNIT=aeontra-rootless.service _UID="$(id -u aeontra-workload)" 2>&1 | tail -c 16384 > /opt/aeontra-control/rootless-service.log'; then
              printf '%s\n' 'aeontra-untrusted-log diagnostic "daemon journal capture failed"'
            fi
          fi
          sudo python3 - <<'PYTHON'
          import json, os, stat
          from collections import deque
          directory = '/opt/aeontra-control/'
          if not os.path.exists(directory + 'ci.json'):
              raise SystemExit(0)
          values = json.load(open(directory + 'ci.json'))
          public_metadata = {'GITHUB_REF', 'GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'}
          secrets = sorted((value for key, value in values.items() if key not in public_metadata
                            and isinstance(value, str) and value), key=len, reverse=True)
          # Reserve room for one fixed capture/open error without exceeding
          # the total encoded-output ceiling.
          budget = (16 << 10) - 256
          def invalid_log():
              print('aeontra-untrusted-log diagnostic "invalid private diagnostic log"')
              raise SystemExit(1)
          def emit_lines(name, lines, allowance):
              global budget
              for line in lines:
                  encoded = 'aeontra-untrusted-log ' + name + ' ' + json.dumps(line[:1024], ensure_ascii=True)
                  cost = len(encoded) + 1
                  if cost > min(budget, allowance):
                      break
                  print(encoded)
                  budget -= cost
                  allowance -= cost
          # Fixed controller-owned logs only; failures before command execution
          # must remain observable. No glob, environment file or source input.
          names = ('acl-diagnostics', 'command', 'rootless-service', 'docker-info', 'workspace-bind', 'volume-copy',
                   'builder-export', 'cache-export', 'builder-remove',
                   'builder-import', 'cache-import', 'pinned-go', 'make')
          for name in names:
              try:
                  fd = os.open(directory + name + '.log', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              except FileNotFoundError:
                  continue
              except OSError:
                  invalid_log()
              if not stat.S_ISREG(os.fstat(fd).st_mode):
                  os.close(fd)
                  invalid_log()
              with os.fdopen(fd, 'rb') as log:
                  window = (2 << 20) if name == 'command' else (4 << 10)
                  start = max(0, os.fstat(log.fileno()).st_size - window)
                  log.seek(start)
                  raw = log.read(window)
              # A truncated first line could begin inside a credential. Keep
              # complete lines at both boundaries before credential redaction.
              if start:
                  _, _, raw = raw.partition(b'\n')
              raw, _, _ = raw.rpartition(b'\n')
              data = raw.decode('utf-8', errors='replace')
              for value in secrets:
                  data = data.replace(value, '[REDACTED]')
              if name == 'command':
                  # A Go panic can precede a large goroutine dump. Preserve a
                  # bounded error context before its tail, never as a receipt.
                  lines = data.splitlines()
                  context, following, panic = deque(maxlen=64), 0, None
                  markers = ('panic:', '--- FAIL:', 'FAIL', 'Error response', 'ERROR', 'error:', 'make:')
                  for index, line in enumerate(lines):
                      if line.lstrip().startswith('panic:'):
                          panic = index
                      if line.lstrip().startswith(markers):
                          following = 16
                      if following:
                          context.append(line)
                          following -= 1
                  # Earlier negative-test errors must not hide the last panic.
                  if panic is not None:
                      context = lines[panic:panic + 32]
                  emit_lines(name, context, 4 << 10)
                  # Discard a partial tail line before emitting it as well.
                  tail = data[-4096:]
                  if len(data) > 4096:
                      _, _, tail = tail.partition('\n')
                  emit_lines(name, tail.splitlines(), 4 << 10)
              else:
                  emit_lines(name, data.splitlines(), budget)
          PYTHON

      - name: Stop disposable workload
        if: always()
        shell: bash
        run: |
          if id aeontra-workload >/dev/null 2>&1; then
            workload_uid="$(id -u aeontra-workload)"
            sudo systemctl stop "user@${workload_uid}.service"
            sudo pkill -KILL -u aeontra-workload || test "$?" = 1
          fi
