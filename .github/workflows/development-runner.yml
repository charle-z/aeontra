              account = pwd.getpwnam('aeontra-workload')
              verify_maps(text, account.pw_uid, account.pw_gid)
              print('Rootless subordinate UID/GID maps verified for nested allocation')
          NESTED_IDMAP
          # Exercise image-to-volume xattr copying, not only workspace binds.
          sudo python3 /opt/aeontra-control/execute.py volume-copy docker run --rm --pull=never --network=none --read-only --memory 256m --pids-limit 64 --mount type=volume,dst=/tmp busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0 sh -eu -c 'test "$(cat /sys/fs/cgroup/memory.max)" = 268435456; test "$(cat /sys/fs/cgroup/pids.max)" = 64; printf "%s\n" volume-copy-verified > /tmp/aeontra-proof; cat /tmp/aeontra-proof'
          sudo grep -Fx volume-copy-verified /opt/aeontra-control/volume-copy.log
          workload_uid="$(id -u aeontra-workload)"
          user_systemctl=(sudo -u aeontra-workload env -i HOME=/home/aeontra-workload PATH=/usr/bin:/bin XDG_RUNTIME_DIR="/run/user/$workload_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$workload_uid/bus" systemctl --user)
          "${user_systemctl[@]}" show aeontra-rootless.service --property=Delegate --value | grep -Fx yes
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          cgroup="$("${user_systemctl[@]}" show aeontra-rootless.service --property=ControlGroup --value)"
          test "$cgroup" = "/user.slice/user-${workload_uid}.slice/user@${workload_uid}.service/app.slice/aeontra-rootless.service"
          manager_cgroup="/sys/fs/cgroup/user.slice/user-${workload_uid}.slice/user@${workload_uid}.service"
          test "$(sudo cat "$manager_cgroup/memory.max")" = 10737418240
          test "$(sudo cat "$manager_cgroup/pids.max")" = 4096
          sudo runuser -u aeontra-workload -- sh -eu -c 'test -w "$1/cgroup.procs"; test -w "$1/cgroup.subtree_control"' sh "/sys/fs/cgroup$cgroup"
          # Real nested runc/proc execution and GitHub cache export/import. No
          # capability is inferred merely from the runs-on label or env names.
          sudo install -d -o aeontra-workload -g aeontra-workload -m 0700 /home/aeontra-workload/probe
          printf '%s\n' 'FROM busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0' 'RUN test -r /proc/self/status && echo measured > /proof' | sudo tee /home/aeontra-workload/probe/Dockerfile >/dev/null
          sudo chown aeontra-workload:aeontra-workload /home/aeontra-workload/probe/Dockerfile
          buildkit_image=moby/buildkit:v0.31.2-ubuntu@sha256:50cccfc001857e9e198d41632c0c2ca5a43ec5d0bf8f01335edab2c42215c9ae
          sudo python3 /opt/aeontra-control/execute.py builder-export docker buildx create --name measured-export --driver docker-container --driver-opt "image=$buildkit_image" --use
          sudo python3 /opt/aeontra-control/execute.py cache-export docker buildx build --progress=plain --cache-to "type=gha,version=2,scope=$EFFECT_ID,mode=max" --output type=cacheonly /home/aeontra-workload/probe
          sudo python3 /opt/aeontra-control/execute.py builder-remove docker buildx rm measured-export
          sudo python3 /opt/aeontra-control/execute.py builder-import docker buildx create --name measured-import --driver docker-container --driver-opt "image=$buildkit_image" --use
          sudo python3 /opt/aeontra-control/execute.py cache-import docker buildx build --progress=plain --cache-from "type=gha,version=2,scope=$EFFECT_ID" --output type=cacheonly /home/aeontra-workload/probe
          sudo grep -q CACHED /opt/aeontra-control/cache-import.log
          sudo python3 /opt/aeontra-control/execute.py pinned-go go version
          sudo grep -Fx 'go version go1.26.8 linux/amd64' /opt/aeontra-control/pinned-go.log
          sudo python3 /opt/aeontra-control/execute.py make make --version

      - name: Execute exact profile
        id: exact-command
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND_PROFILE" in
            probe-only) sudo install -m 0600 /dev/null /opt/aeontra-control/command.log ;;
            make-validate-all) sudo python3 /opt/aeontra-control/execute.py command make validate-all ;;
            go-test-all) sudo python3 /opt/aeontra-control/execute.py command go test ./... -count=1 ;;
            *) exit 1 ;;
          esac

      - name: Inspect rootless storage ACL after exact make failure
        if: ${{ !cancelled() && steps.exact-command.outcome == 'failure' && inputs.command_profile == 'make-validate-all' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 /opt/aeontra-control/execute.py acl-diagnostics acl-diagnostics

      - name: Inspect rootless overlay compatibility
        if: ${{ !cancelled() && (inputs.command_profile == 'probe-only' || (steps.exact-command.outcome == 'failure' && inputs.command_profile == 'make-validate-all')) }}
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 /opt/aeontra-control/execute.py overlay-diagnostics overlay-diagnostics

      - name: Bind trusted receipt
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's exact-run job/step metadata is the broker receipt source.
          # Repository-controlled files/logs/artifacts are never attestation.
          workload_uid="$(id -u aeontra-workload)"
          sudo -u aeontra-workload env -i HOME=/home/aeontra-workload PATH=/usr/bin:/bin XDG_RUNTIME_DIR="/run/user/$workload_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$workload_uid/bus" systemctl --user stop aeontra-rootless.service
          sudo test -f /opt/aeontra-control/command.log
          sudo test ! -L /opt/aeontra-control/command.log
          printf '%s\n' 'Exact command completed; semantic acceptance remains separate.'

      - name: Capture bounded workload resource counters
        if: always()
        shell: bash
        run: |
          if ! sudo test -d /opt/aeontra-control; then exit 0; fi
          sudo python3 - <<'RESOURCE_COUNTERS'
          import json, os, pwd, stat, subprocess
          def read_counter(group, name):
              fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=group)
              try:
                  if not stat.S_ISREG(os.fstat(fd).st_mode): raise ValueError('nonregular counter')
                  data = os.read(fd, 1025)
                  if len(data) > 1024: raise ValueError('oversized counter')
              finally:
                  os.close(fd)
              tokens = data.decode('ascii').split()
              if name.endswith('.events'):
                  allowed = {'max'} if name == 'pids.events' else {'low', 'high', 'max', 'oom', 'oom_kill', 'oom_group_kill', 'sock_throttled'}
                  if len(tokens) % 2: raise ValueError('invalid event pairs')
                  result = {}
                  for key, value in zip(tokens[::2], tokens[1::2]):
                      if key not in allowed or key in result or not value.isdecimal(): raise ValueError('invalid event')
                      result[key] = int(value)
                  return result
              if len(tokens) != 1 or not (tokens[0].isdecimal() or tokens[0] == 'max'):
                  raise ValueError('invalid scalar counter')
              return int(tokens[0]) if tokens[0].isdecimal() else 'max'
          def capture(unit, scope):
              group = None
              try:
                  result = subprocess.run(['/usr/bin/systemctl', 'show', unit, '--property=ControlGroup', '--value'],
                                          capture_output=True, timeout=3, env={'PATH': '/usr/bin:/bin'})
                  if result.returncode or len(result.stdout) > 1024: raise ValueError('unit unavailable')
                  path = result.stdout.decode('ascii').strip()
                  if not path.startswith('/') or path == '/': raise ValueError('empty unit cgroup')
                  parts = path[1:].split('/')
                  if any(part in ('', '.', '..') for part in parts): raise ValueError('invalid cgroup path')
                  flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
                  group = os.open('/sys/fs/cgroup', flags)
                  for part in parts:
                      child = os.open(part, flags, dir_fd=group)
                      os.close(group); group = child
                  counters = {name: read_counter(group, name) for name in
                              ('pids.current', 'pids.max', 'pids.events', 'memory.current', 'memory.max', 'memory.events')}
                  return {'scope': scope, 'state': 'observed', 'counters': counters}
              except (OSError, ValueError, subprocess.SubprocessError) as error:
                  return {'scope': scope, 'state': 'unavailable', 'error_type': type(error).__name__}
              finally:
                  if group is not None: os.close(group)
          try:
              uid = pwd.getpwnam('aeontra-workload').pw_uid
          except KeyError:
              raise SystemExit(0)
          if uid <= 0: raise ValueError('invalid workload identity')
          with open('/opt/aeontra-control/resources.log', 'w') as log:
              for unit, scope in (('user@%d.service' % uid, 'rootless-manager'), ('aeontra-command.service', 'command')):
                  log.write(json.dumps(capture(unit, scope)) + '\n')
          RESOURCE_COUNTERS

      - name: Bounded untrusted command diagnostics
        if: always()
        shell: bash
        run: |
          if sudo test -d /opt/aeontra-control; then
            if ! sudo bash -o pipefail -c 'umask 077; journalctl --no-pager --lines=40 --output=cat _SYSTEMD_USER_UNIT=aeontra-rootless.service _UID="$(id -u aeontra-workload)" 2>&1 | tail -c 16384 > /opt/aeontra-control/rootless-service.log'; then
              printf '%s\n' 'aeontra-untrusted-log diagnostic "daemon journal capture failed"'
            fi
          fi
          sudo python3 - <<'PYTHON'
          import json, os, re, stat
          from collections import deque
          directory = '/opt/aeontra-control/'
          if not os.path.exists(directory + 'ci.json'):
              raise SystemExit(0)
          values = json.load(open(directory + 'ci.json'))
          public_metadata = {'GITHUB_REF', 'GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'}
          secrets = sorted((value for key, value in values.items() if key not in public_metadata
                            and isinstance(value, str) and value), key=len, reverse=True)
          # Reserve room for one fixed capture/open error without exceeding
          # the total encoded-output ceiling.
          budget = (16 << 10) - 256
          command_reserved = (8 << 10) + 256 if os.path.exists(directory + 'command.log') else 0
          def invalid_log():
              print('aeontra-untrusted-log diagnostic "invalid private diagnostic log"')
              raise SystemExit(1)
          def emit_lines(name, lines, allowance):
              global budget
              for line in lines:
                  encoded = 'aeontra-untrusted-log ' + name + ' ' + json.dumps(line[:1024], ensure_ascii=True)
                  cost = len(encoded) + 1
                  if cost > min(budget, allowance):
                      break
                  print(encoded)
                  budget -= cost
                  allowance -= cost
          def encoded_tail(name, lines, allowance):
              selected, available = [], min(budget, allowance)
              for line in reversed(lines):
                  encoded = 'aeontra-untrusted-log ' + name + ' ' + json.dumps(line[:1024], ensure_ascii=True)
                  cost = len(encoded) + 1
                  if cost > available: break
                  selected.append(encoded); available -= cost
              return list(reversed(selected))
          def emit_encoded(lines):
              global budget
              for line in lines:
                  print(line); budget -= len(line) + 1
          def critical_context():
              try:
                  fd = os.open(directory + 'command-context.log', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              except FileNotFoundError:
                  return None
              except OSError:
                  invalid_log()
              with os.fdopen(fd, 'rb') as log:
                  if not stat.S_ISREG(os.fstat(log.fileno()).st_mode) or os.fstat(log.fileno()).st_size > (16 << 10) + 256:
                      invalid_log()
                  raw = log.read((16 << 10) + 257)
              if len(raw) > (16 << 10) + 256: invalid_log()
              header, _, body = raw.partition(b'\n')
              def redacted_lines(value):
                  text = value.decode('utf-8', errors='replace')
                  for secret in secrets: text = text.replace(secret, '[REDACTED]')
                  return text.splitlines()
              if header.startswith(b'aeontra-context reason=subtest'):
                  match = re.fullmatch(rb'aeontra-context reason=subtest first_bytes=([0-9]{1,20}) subtest_marker_bytes=([0-9]{1,20}) subtest_before_bytes=([0-9]{1,20}) subtest_after_bytes=([0-9]{1,20}) panic_bytes=([0-9]{1,20}) bytes_retained=([0-9]{1,20}) oversize_lines=[0-9]{1,20}', header)
                  if not match: invalid_log()
                  first_bytes, marker_bytes, before_bytes, after_bytes, panic_bytes, retained = (int(value) for value in match.groups())
                  if (first_bytes > (4 << 10) or panic_bytes > (4 << 10) or not 0 < marker_bytes <= (4 << 10) or before_bytes > (4 << 10)
                      or marker_bytes + before_bytes + after_bytes > (8 << 10) or first_bytes + marker_bytes + before_bytes + after_bytes + panic_bytes != retained or retained != len(body)):
                      invalid_log()
                  sections, offset = [], 0
                  for size in (first_bytes, marker_bytes, before_bytes, after_bytes, panic_bytes):
                      section = body[offset:offset + size]; offset += size
                      if section and not section.endswith(b'\n'): invalid_log()
                      sections.append(section)
                  first, marker, before, after, panic = sections
                  # The marker is emitted before bounded surrounding text so
                  # nearby noise cannot displace the observed test identity.
                  marker_display = '\n'.join(redacted_lines(marker))
                  if len(marker_display) > 128:
                      marker_display = marker_display[:128] + ' [marker display truncated]'
                  sample = ['aeontra-context first-failed-subtest surrounding-stdout-unassociated', marker_display]
                  sample += ['aeontra-context preceding-stdout-unassociated'] + redacted_lines(before)
                  sample += ['aeontra-context following-stdout-unassociated'] + redacted_lines(after)
                  observed = ['aeontra-context first-observed-failure'] + redacted_lines(first) if first else []
                  last = redacted_lines(header) + (['aeontra-context last-panic'] + redacted_lines(panic) if panic else [])
                  return observed, sample, last
              if header.startswith(b'aeontra-context reason=both'):
                  match = re.fullmatch(rb'aeontra-context reason=both first_bytes=([0-9]{1,20}) panic_bytes=([0-9]{1,20}) bytes_retained=([0-9]{1,20}) oversize_lines=[0-9]{1,20}', header)
                  if not match: invalid_log()
                  first_bytes, panic_bytes, retained = (int(value) for value in match.groups())
                  if first_bytes > (8 << 10) or panic_bytes > (8 << 10) or first_bytes + panic_bytes != retained or retained != len(body):
                      invalid_log()
                  if not retained: return None
                  first, panic = body[:first_bytes], body[first_bytes:]
                  if (first and not first.endswith(b'\n')) or (panic and not panic.endswith(b'\n')):
                      invalid_log()
                  # Byte lengths, not untrusted section-like log markers, frame
                  # the observed first failure and independently bounded panic.
                  return (['aeontra-context first-observed-failure'] + redacted_lines(first), [],
                          redacted_lines(header) + ['aeontra-context last-panic'] + redacted_lines(panic))
              raw, _, _ = raw.rpartition(b'\n')
              text = raw.decode('utf-8', errors='replace')
              for value in secrets: text = text.replace(value, '[REDACTED]')
              lines = text.splitlines()
              return ([], [], lines) if len(lines) > 1 else None
          # Fixed controller-owned logs only; failures before command execution
          # must remain observable. No glob, environment file or source input.
          names = ('resources', 'acl-diagnostics', 'overlay-diagnostics', 'command', 'rootless-service', 'docker-info', 'workspace-bind', 'nested-idmap', 'volume-copy',
                   'builder-export', 'cache-export', 'builder-remove',
                   'builder-import', 'cache-import', 'pinned-go', 'make')
          for name in names:
              try:
                  fd = os.open(directory + name + '.log', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              except FileNotFoundError:
                  continue
              except OSError:
                  invalid_log()
              if not stat.S_ISREG(os.fstat(fd).st_mode):
                  os.close(fd)
                  invalid_log()
              with os.fdopen(fd, 'rb') as log:
                  if name == 'command':
                      header = log.readline(256)
                      if re.fullmatch(rb'aeontra-capture bytes_seen=[0-9]{1,20} bytes_dropped=[0-9]{1,20} bytes_retained=[0-9]{1,20}\n', header):
                          text = header.decode('ascii').rstrip()
                          for value in secrets: text = text.replace(value, '[REDACTED]')
                          emit_lines(name, [text], 256)
                  window = (2 << 20) if name == 'command' else (4 << 10)
                  start = max(0, os.fstat(log.fileno()).st_size - window)
                  log.seek(start)
                  raw = log.read(window)
              # A truncated first line could begin inside a credential. Keep
              # complete lines at both boundaries before credential redaction.
              if start:
                  _, _, raw = raw.partition(b'\n')
              raw, _, _ = raw.rpartition(b'\n')
              data = raw.decode('utf-8', errors='replace')
              for value in secrets:
                  data = data.replace(value, '[REDACTED]')
              if name == 'command':
                  # A Go panic can precede a large goroutine dump. Preserve a
                  # bounded error context before its tail, never as a receipt.
                  lines = data.splitlines()
                  context, following, panic = deque(maxlen=64), 0, None
                  markers = ('panic:', '--- FAIL:', 'FAIL', 'Error response', 'ERROR', 'error:', 'make:')
                  for index, line in enumerate(lines):
                      if line.lstrip().startswith('panic:'):
                          panic = index
                      if line.lstrip().startswith(markers):
                          following = 16
                      if following:
                          context.append(line)
                          following -= 1
                  # Earlier negative-test errors must not hide the last panic.
                  if panic is not None:
                      context = lines[panic:panic + 32]
                  critical = critical_context()
                  observed, sample = [], []
                  if critical: observed, sample, context = critical
                  # Discard a partial tail line before emitting it as well.
                  tail = data[-4096:]
                  if len(data) > 4096:
                      _, _, tail = tail.partition('\n')
                  selected = encoded_tail(name, tail.splitlines(), 4 << 10)
                  reserved = sum(len(line) + 1 for line in selected)
                  allowance = min(4 << 10, max(0, budget - reserved))
                  if observed:
                      before = budget
                      emit_lines(name, observed, allowance // (4 if sample else 2))
                      allowance -= before - budget
                  if sample:
                      before = budget
                      emit_lines(name, sample, min(2 << 10, allowance))
                      allowance -= before - budget
                  emit_lines(name, context, allowance)
                  emit_encoded(selected)
                  command_reserved = 0
              else:
                  emit_lines(name, data.splitlines(), max(0, budget - command_reserved))
          PYTHON

      - name: Stop disposable workload
        if: always()
        shell: bash
        run: |
          if id aeontra-workload >/dev/null 2>&1; then
            workload_uid="$(id -u aeontra-workload)"
            sudo systemctl stop "user@${workload_uid}.service"
            sudo pkill -KILL -u aeontra-workload || test "$?" = 1
          fi
