                  if first is None and stripped.startswith((b'panic:', b'--- FAIL:', b'Error response', b'ERROR', b'error:', b'make:')):
                      first, remaining[0] = [], 32
                  for index, context in enumerate((first, panic)):
                      if remaining[index]:
