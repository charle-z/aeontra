name: E2E distributed OpenCode

on:
  push:
    branches:
      - main
      - 'p11-2-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributed-opencode:
    name: E2E distributed OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify executable runner
        run: |
          test -x test/opencode-e2e/run.sh
          test "$(git ls-files -s test/opencode-e2e/run.sh | awk '{print $1}')" = "100755"

      - name: Run isolated remote relay
        run: |
          mkdir -p artifacts
          set +e
          ./test/opencode-e2e/run.sh 2>&1 | tee artifacts/opencode-remote-e2e.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            test -s artifacts/opencode-remote-e2e-report.json
          fi
          exit "$status"

      - name: Verify structured report
        run: |
          test -s artifacts/opencode-remote-e2e-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/opencode-remote-e2e-report.json")
          report = json.loads(path.read_text())
          assert report["mode"] == "remote-distributed"
          assert report["processes"] == [
              "mcp-devbox-server",
              "mcp-edge",
              "model-turn-driver",
              "opencode-1.18.1",
          ]
          assert report["mcp_calls"] == 10
          assert report["mcp_calls"] < 20
          assert report["model_turns"] == 4
          assert report["tool_executions"] == 4
          assert report["tool_names"] == ["read", "grep", "edit", "bash"]
          assert report["process_isolation_verified"] is True
          assert report["distinct_process_count"] == 4
          assert report["authoritative_sqlite_shared"] is False
          assert report["retries"] == 0
          assert report["duplicate_turns"] == 0
          assert report["duplicate_consumptions"] == 0
          assert report["completed"] is True
          assert report["repository_modified"] is True
          assert report["tests_passed"] is True
          assert report["vps_result_store_bytes"] > 0
          assert report["edge_journal_bytes"] > 0
          assert report["edge_http_calls"] >= 8
          print(json.dumps(report, separators=(",", ":"), sort_keys=True))
          PY

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-remote-e2e-log
          path: artifacts/opencode-remote-e2e.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-remote-e2e-report
          path: artifacts/opencode-remote-e2e-report.json
          if-no-files-found: error
          retention-days: 30
