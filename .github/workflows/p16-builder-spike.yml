name: P16 private rootless builder candidate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rootless-buildkit-candidate:
    name: Rootless BuildKit candidate fixture
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify private builder contracts
        run: go test ./internal/buildspike ./packaging/builder ./internal/coveragegate -count=1

      - name: Install reviewed package resources
        run: |
          sudo install -d -o root -g root -m 0755 /usr/share/mcp-devbox-builder-candidate
          sudo install -o root -g root -m 0755 packaging/builder/install-prerequisites.sh /usr/share/mcp-devbox-builder-candidate/install-prerequisites.sh
          sudo install -o root -g root -m 0755 packaging/builder/stage-official-v0.31.2.sh /usr/share/mcp-devbox-builder-candidate/stage-official-v0.31.2.sh
          sudo install -o root -g root -m 0755 packaging/builder/install-preverified.sh /usr/share/mcp-devbox-builder-candidate/install-preverified.sh
          sudo install -o root -g root -m 0755 packaging/builder/remove.sh /usr/share/mcp-devbox-builder-candidate/remove.sh
          sudo install -o root -g root -m 0644 packaging/builder/buildkitd.toml /usr/share/mcp-devbox-builder-candidate/buildkitd.toml
          sudo install -o root -g root -m 0644 packaging/builder/mcp-devbox-buildkit.service /usr/share/mcp-devbox-builder-candidate/mcp-devbox-buildkit.service
          sudo install -o root -g root -m 0644 packaging/builder/mcp-devbox-buildkit-runc.apparmor /usr/share/mcp-devbox-builder-candidate/mcp-devbox-buildkit-runc.apparmor

      - name: Install rootless host prerequisites
        run: sudo /usr/share/mcp-devbox-builder-candidate/install-prerequisites.sh

      - name: Seed Ubuntu 22.04 builder identity
        run: |
          sudo useradd --system --user-group --create-home \
            --home-dir /var/lib/mcp-devbox-buildkit --shell /usr/sbin/nologin mcp-build
          sudo usermod --add-subuids 200000-265535 --add-subgids 200000-265535 mcp-build
          getent passwd mcp-build | grep -F ':/var/lib/mcp-devbox-buildkit:/usr/sbin/nologin'
          grep -Fx 'mcp-build:200000:65536' /etc/subuid
          grep -Fx 'mcp-build:200000:65536' /etc/subgid

      - name: Stage pinned official BuildKit release
        run: sudo /usr/share/mcp-devbox-builder-candidate/stage-official-v0.31.2.sh

      - name: Install and verify rootless service
        run: |
          set -Eeuo pipefail
          install_log="$RUNNER_TEMP/install-preverified.log"
          set +e
          sudo /usr/share/mcp-devbox-builder-candidate/install-preverified.sh 2>&1 | tee "$install_log"
          install_status=${PIPESTATUS[0]}
          set -e
          if test "$install_status" -ne 0; then
            message="$(tail -n 24 "$install_log")"
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/' | '}
            printf '::error title=Rootless service installation failed::%s\n' "$message"
            exit "$install_status"
          fi
          sudo systemd-analyze verify /etc/systemd/system/mcp-devbox-buildkit.service
          sudo test -f /etc/apparmor.d/mcp-devbox-buildkit-runc
          sudo cmp -s /etc/apparmor.d/mcp-devbox-buildkit-runc /usr/share/mcp-devbox-builder-candidate/mcp-devbox-buildkit-runc.apparmor
          sudo systemctl is-active --quiet mcp-devbox-buildkit.service
          socket=/run/mcp-devbox-buildkit/buildkit/buildkitd.sock
          sudo test -S "$socket"
          sudo runuser -u mcp-build -- /usr/local/lib/mcp-devbox-builder/buildctl --addr "unix://$socket" debug workers
          sudo systemctl show mcp-devbox-buildkit.service \
            --property=User --property=Group --property=KillMode \
            --property=ProtectProc \
            --property=MemoryHigh --property=MemoryMax --property=TasksMax \
            | tee "$RUNNER_TEMP/builder-properties.txt" >/dev/null
          if sudo grep -Eq '^RestrictNamespaces=' /etc/systemd/system/mcp-devbox-buildkit.service; then
            echo 'unexpected systemd namespace filter in builder unit' >&2
            exit 1
          fi
          grep -Fx 'User=mcp-build' "$RUNNER_TEMP/builder-properties.txt"
          grep -Fx 'Group=mcp-build' "$RUNNER_TEMP/builder-properties.txt"
          grep -Fx 'KillMode=control-group' "$RUNNER_TEMP/builder-properties.txt"
          grep -Fx 'ProtectProc=default' "$RUNNER_TEMP/builder-properties.txt"
          grep -Fx 'MemoryHigh=1342177280' "$RUNNER_TEMP/builder-properties.txt"
          grep -Fx 'MemoryMax=1879048192' "$RUNNER_TEMP/builder-properties.txt"
          grep -Fx 'TasksMax=512' "$RUNNER_TEMP/builder-properties.txt"

      - name: Prove service cgroup ownership and subtree
        run: |
          main_pid="$(sudo systemctl show mcp-devbox-buildkit.service --property=MainPID --value)"
          test "$main_pid" -gt 1
          cgroup="$(sudo awk -F: '$1 == "0" {print $3}' "/proc/$main_pid/cgroup")"
          case "$cgroup" in
            */mcp-devbox-buildkit.service) ;;
            *) echo "unexpected builder cgroup: $cgroup" >&2; exit 1 ;;
          esac
          builder_uid="$(id -u mcp-build)"
          processes="$RUNNER_TEMP/builder-processes.txt"
          : > "$processes"
          sudo find "/sys/fs/cgroup$cgroup" -name cgroup.procs -type f -exec cat {} + | sort -nu | while read -r pid; do
            test -r "/proc/$pid/status" || continue
            uid="$(sudo awk '/^Uid:/ {print $2}' "/proc/$pid/status")"
            test "$uid" = "$builder_uid"
            command="$(sudo cat "/proc/$pid/comm")"
            printf '%s %s %s\n' "$pid" "$uid" "$command" | tee -a "$processes"
          done
          grep -Eq ' rootlesskit$' "$processes"
          grep -Eq ' buildkitd$' "$processes"

      - name: Exercise runc and both Dockerfile frontends with cache reuse
        run: |
          set -Eeuo pipefail
          fixture=/var/lib/mcp-devbox-builder-fixture
          integrated_context="$fixture/integrated-context"
          external_context="$fixture/external-context"
          integrated_first="$fixture/integrated-first"
          integrated_second="$fixture/integrated-second"
          external_output="$fixture/external-output"
          cache=/var/cache/mcp-devbox-buildkit/fixture
          sudo install -d -o mcp-build -g mcp-build -m 0700 \
            "$integrated_context" "$external_context" \
            "$integrated_first" "$integrated_second" "$external_output" "$cache"
          printf 'FROM busybox:1.37.0\nRUN echo p16-runc-ok > /ok\n' \
            | sudo tee "$integrated_context/Dockerfile" >/dev/null
          printf '# syntax=docker/dockerfile:1.7\nFROM busybox:1.37.0\nRUN echo p16-external-runc-ok > /ok\n' \
            | sudo tee "$external_context/Dockerfile" >/dev/null
          sudo chown -R mcp-build:mcp-build "$fixture" "$cache"
          socket=/run/mcp-devbox-buildkit/buildkit/buildkitd.sock

          run_checked() {
            label=$1
            log=$2
            shift 2
            set +e
            "$@" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if test "$status" -ne 0; then
              message="$(tail -n 24 "$log")"
              message=${message//'%'/'%25'}
              message=${message//$'\r'/'%0D'}
              message=${message//$'\n'/' | '}
              printf '::error title=%s::%s\n' "$label" "$message"
              return "$status"
            fi
          }

          verify_output() {
            label=$1
            expected=$2
            path=$3
            if ! sudo runuser -u mcp-build -- grep -Fx "$expected" "$path"; then
              printf '::error title=%s::expected output %s was not present at %s\n' "$label" "$expected" "$path"
              return 1
            fi
          }

          run_checked "Integrated runc no-cache build failed" "$RUNNER_TEMP/integrated-first-build.log" \
            sudo runuser -u mcp-build -- /usr/local/lib/mcp-devbox-builder/buildctl \
            --addr "unix://$socket" build --progress plain \
            --frontend dockerfile.v0 \
            --local "context=$integrated_context" --local "dockerfile=$integrated_context" \
            --opt filename=Dockerfile --no-cache \
            --export-cache "type=local,dest=$cache,mode=max,reset=true" \
            --output "type=local,dest=$integrated_first"
          verify_output "Integrated runc output verification failed" p16-runc-ok "$integrated_first/ok"

          run_checked "Integrated cached build failed" "$RUNNER_TEMP/integrated-second-build.log" \
            sudo runuser -u mcp-build -- /usr/local/lib/mcp-devbox-builder/buildctl \
            --addr "unix://$socket" build --progress plain \
            --frontend dockerfile.v0 \
            --local "context=$integrated_context" --local "dockerfile=$integrated_context" \
            --opt filename=Dockerfile \
            --import-cache "type=local,src=$cache" \
            --export-cache "type=local,dest=$cache,mode=max,reset=true" \
            --output "type=local,dest=$integrated_second"
          verify_output "Integrated cached output verification failed" p16-runc-ok "$integrated_second/ok"
          if ! grep -Eq 'CACHED|cached' "$RUNNER_TEMP/integrated-second-build.log"; then
            echo '::error title=Integrated cache verification failed::second integrated build did not report cached execution'
            exit 1
          fi

          run_checked "External Dockerfile frontend build failed" "$RUNNER_TEMP/external-frontend-build.log" \
            sudo runuser -u mcp-build -- /usr/local/lib/mcp-devbox-builder/buildctl \
            --addr "unix://$socket" build --progress plain \
            --frontend dockerfile.v0 \
            --local "context=$external_context" --local "dockerfile=$external_context" \
            --opt filename=Dockerfile --no-cache \
            --output "type=local,dest=$external_output"
          verify_output "External frontend output verification failed" p16-external-runc-ok "$external_output/ok"

          sudo runuser -u mcp-build -- /usr/local/lib/mcp-devbox-builder/buildctl \
            --addr "unix://$socket" du -v \
            2>&1 | tee "$RUNNER_TEMP/cache-usage.txt"
          test -s "$RUNNER_TEMP/cache-usage.txt"
          cache_usage_output_bytes="$(stat -c '%s' "$RUNNER_TEMP/cache-usage.txt")"
          test "$cache_usage_output_bytes" -gt 0
          test "$cache_usage_output_bytes" -le 1048576
          sudo grep -F 'maxUsedSpace = "4GB"' /etc/mcp-devbox-builder/buildkitd.toml \
            | tee "$RUNNER_TEMP/cache-policy.txt"
          test -s "$RUNNER_TEMP/cache-policy.txt"

      - name: Verify stop kills the complete service cgroup
        run: |
          main_pid="$(sudo systemctl show mcp-devbox-buildkit.service --property=MainPID --value)"
          sudo systemctl stop mcp-devbox-buildkit.service
          for _ in $(seq 1 30); do
            if ! sudo kill -0 "$main_pid" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "builder process survived service stop" >&2
          exit 1

      - name: Verify conservative removal
        run: |
          sudo /usr/share/mcp-devbox-builder-candidate/remove.sh
          test ! -e /etc/systemd/system/mcp-devbox-buildkit.service
          test ! -e /usr/local/lib/mcp-devbox-builder/buildkitd
          test -d /var/lib/mcp-devbox-buildkit
          test -d /var/cache/mcp-devbox-buildkit
          id mcp-build
          test -d /var/lib/mcp-devbox-builder-staging

      - name: Upload bounded fixture evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p16-rootless-buildkit-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/install-preverified.log
            ${{ runner.temp }}/builder-properties.txt
            ${{ runner.temp }}/builder-processes.txt
            ${{ runner.temp }}/integrated-first-build.log
            ${{ runner.temp }}/integrated-second-build.log
            ${{ runner.temp }}/external-frontend-build.log
            ${{ runner.temp }}/cache-usage.txt
            ${{ runner.temp }}/cache-policy.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup fixture state
        if: always()
        run: |
          sudo systemctl disable --now mcp-devbox-buildkit.service >/dev/null 2>&1 || true
          sudo rm -rf \
            /usr/share/mcp-devbox-builder-candidate \
            /etc/apparmor.d/mcp-devbox-buildkit-runc \
            /var/lib/mcp-devbox-builder-staging \
            /var/lib/mcp-devbox-builder-fixture \
            /var/lib/mcp-devbox-buildkit \
            /var/cache/mcp-devbox-buildkit \
            /run/mcp-devbox-buildkit
          sudo userdel mcp-build >/dev/null 2>&1 || true
