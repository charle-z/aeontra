name: Trusted Linux Workcell E2E

on:
  push:
    branches:
      - main
      - p12-trusted-linux-workcell
  pull_request:
  workflow_dispatch:

concurrency:
  group: trusted-linux-workcell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trusted-host:
    name: Trusted host and HTB fixture
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Bubblewrap and controlled wordlists
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo install -d -o root -g root -m 0755 /usr/share/seclists /usr/share/wordlists
          printf 'p12-seclists-fixture\n' | sudo tee /usr/share/seclists/p12-fixture.txt >/dev/null
          printf 'p12-wordlists-fixture\n' | sudo tee /usr/share/wordlists/p12-fixture.txt >/dev/null
          sudo chmod 0644 /usr/share/seclists/p12-fixture.txt /usr/share/wordlists/p12-fixture.txt
          bwrap --version
          stat -c '%u %g %a %F %n' /usr/share/seclists /usr/share/wordlists

      - name: Build tagged P12 E2E binary
        run: |
          mkdir -p artifacts "$RUNNER_TEMP/p12-bin"
          go test -c -tags=p12_e2e -o "$RUNNER_TEMP/p12-bin/trusted-linux-workcell.test" ./internal/edgeclient

      - name: Run trusted host Bubblewrap E2E
        env:
          P12_WORKCELL_HOST_E2E: "1"
          P12_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          "$RUNNER_TEMP/p12-bin/trusted-linux-workcell.test" \
            -test.run=^TestTrustedLinuxWorkcellHostE2E$ -test.count=1 -test.v

      - name: Run controlled HTB fixture E2E
        env:
          P12_HTB_FIXTURE_E2E: "1"
          P12_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          "$RUNNER_TEMP/p12-bin/trusted-linux-workcell.test" \
            -test.run=^TestTrustedLinuxWorkcellHTBFixtureE2E$ -test.count=1 -test.v

      - name: Verify trusted host evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          host = json.loads(Path("artifacts/p12-trusted-linux-workcell-host-report.json").read_text())
          assert host["schema_version"] == 1
          assert host["shared_network_reachable"] is True
          assert host["workspace_writable"] is True
          assert host["runtime_writable"] is True
          assert host["wordlists_read_only"] is True
          assert host["seclists_read_only"] is True
          assert host["host_home_visible"] is False
          assert host["root_visible"] is False
          assert host["windows_mounts_visible"] is False
          assert host["rootful_socket_visible"] is False
          assert host["process_group_cancelled"] is True
          assert host["network_posture_validated"] is True

          htb = json.loads(Path("artifacts/p12-trusted-linux-workcell-htb-fixture-report.json").read_text())
          assert htb["schema_version"] == 1
          for key in (
              "preflight_passed",
              "template_rendered",
              "recon_completed",
              "exploit_completed",
              "user_flag_verified",
              "root_flag_verified",
              "current_state_written",
              "resume_validated",
              "cleanup_completed",
              "secrets_absent",
          ):
              assert htb[key] is True
          serialized = json.dumps({"host": host, "htb": htb}).lower()
          for forbidden in ("p12-fixture-user-secret", "p12-fixture-root-secret", "authorization", "cookie", "private key"):
              assert forbidden not in serialized
          PY

      - name: Upload trusted host evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p12-trusted-host-e2e-${{ github.sha }}
          path: |
            artifacts/p12-trusted-linux-workcell-host-report.json
            artifacts/p12-trusted-linux-workcell-htb-fixture-report.json
          if-no-files-found: error
          retention-days: 30

  rootless-runtime:
    name: Rootless Podman, PostgreSQL and Chromium
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install rootless packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap build-essential catatonit containernetworking-plugins fuse-overlayfs \
            libseccomp-dev pkg-config podman python3-venv slirp4netns uidmap
          test -x /usr/bin/podman
          catatonit_path="$(command -v catatonit)"
          test -f "$catatonit_path"
          test ! -L "$catatonit_path"
          test -x "$catatonit_path"
          catatonit --version
          command -v setsid

      - name: Build pinned Podman 5.4.2
        run: |
          set -Eeuo pipefail
          podman_root="$RUNNER_TEMP/podman-5.4.2"
          module="github.com/containers/podman/v5@v5.4.2"
          package="github.com/containers/podman/v5/cmd/podman@v5.4.2"
          install -d -m 0700 "$podman_root/bin" "$podman_root/gopath" "$podman_root/mod"
          export GOBIN="$podman_root/bin"
          export GOPATH="$podman_root/gopath"
          export GOMODCACHE="$podman_root/mod"
          export GOFLAGS="-tags=cni,seccomp,exclude_graphdriver_btrfs,exclude_graphdriver_devicemapper,containers_image_openpgp"
          go mod download -json "$module" >"$podman_root/module.json"
          python3 - "$podman_root/module.json" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["Version"] == "v5.4.2"
          assert data["Sum"] == "h1:r1Rv6GiH0YCFS91B+f0DEgEZK8yfzzkjiECVLjLjcuQ="
          assert data["Origin"]["Hash"] == "be85287fcf4590961614ee37be65eeb315e5d9ff"
          assert data["Origin"]["Ref"] == "refs/tags/v5.4.2"
          PY
          go install "$package"
          test "$("$GOBIN/podman" --version)" = "podman version 5.4.2"
          sudo install -o root -g root -m 0755 "$GOBIN/podman" /usr/bin/podman
          test "$(podman --version)" = "podman version 5.4.2"
          go version -m /usr/bin/podman | grep -F $'mod	github.com/containers/podman/v5	v5.4.2'
          chmod -R u+w "$podman_root"
          rm -rf "$podman_root"

      - name: Install pinned podman-compose
        run: |
          python3 -m venv "$RUNNER_TEMP/podman-compose"
          "$RUNNER_TEMP/podman-compose/bin/pip" install \
            --disable-pip-version-check --no-input podman-compose==1.6.0
          "$RUNNER_TEMP/podman-compose/bin/podman-compose" --version
          echo "$RUNNER_TEMP/podman-compose/bin" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: |
          pnpm --dir web/console exec playwright install --with-deps chromium
          chromium_bin="$(pnpm --dir web/console exec node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          test -x "$chromium_bin"
          echo "P12_CHROMIUM_BIN=$chromium_bin" >> "$GITHUB_ENV"

      - name: Verify managed browser with production Chromium path
        run: |
          set -Eeuo pipefail
          chromium_dir="$(dirname "$P12_CHROMIUM_BIN")"
          chromium_name="$(basename "$P12_CHROMIUM_BIN")"
          sudo install -d -m 0755 /usr/lib/chromium
          sudo cp -a "$chromium_dir"/. /usr/lib/chromium/
          sudo ln -sfn "$chromium_name" /usr/lib/chromium/chromium
          test -x /usr/lib/chromium/chromium
          MCP_DEVBOX_BROWSER_E2E=1 go test ./internal/edgeclient             -run 'TestProjectBrowser.*RealChromium' -count=1 -v

      - name: Build tagged P12 E2E and redactor binaries
        run: |
          mkdir -p "$RUNNER_TEMP/p12-bin" artifacts
          go test ./cmd/rootless-e2e-log-redactor -count=1
          go build -trimpath -o "$RUNNER_TEMP/p12-bin/rootless-e2e-log-redactor" ./cmd/rootless-e2e-log-redactor
          go test -c -tags=p12_e2e -o "$RUNNER_TEMP/p12-bin/trusted-linux-workcell.test" ./internal/edgeclient

      - name: Stage PostgreSQL fixture image
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/p12-postgres-17-alpine.tar"
          for delay in 0 5 15; do
            if [ "$delay" -ne 0 ]; then
              sleep "$delay"
            fi
            if docker pull docker.io/library/postgres:17-alpine; then
              postgres_image_id="$(docker image inspect --format '{{.Id}}' docker.io/library/postgres:17-alpine)"
              case "$postgres_image_id" in
                sha256:????????????????????????????????????????????????????????????????) ;;
                *) echo "P12 rootless category=postgres_image_identity"; exit 1 ;;
              esac
              postgres_image="localhost/p12-postgres-fixture:${postgres_image_id#sha256:}"
              docker image tag docker.io/library/postgres:17-alpine "$postgres_image"
              test "$(docker image inspect --format '{{.Id}}' "$postgres_image")" = "$postgres_image_id"
              docker image save --output "$archive" "$postgres_image"
              test -s "$archive"
              exit 0
            fi
          done
          exit 1

      - name: Run two clean rootless cycles and restart
        env:
          P12_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -Eeuo pipefail
          runtime_root="/run/user/$(id -u)"
          socket="$runtime_root/podman/podman.sock"
          service_pid=""
          service_unit=""
          service_unit_base="p12-rootless-podman-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          service_generation=0
          delegated_wrapper="$RUNNER_TEMP/p12-podman-delegated-wrapper.sh"
          client_containers_conf="$RUNNER_TEMP/p12-rootless-client-containers.conf"
          cleanup_failed=0
          declare -a rootful_paths=()
          declare -a rootful_modes=()

          printf '%s\n' '[engine]' 'cgroup_manager="cgroupfs"' '[network]' 'network_backend="cni"' 'default_rootless_network_cmd="slirp4netns"' >"$client_containers_conf"
          chmod 0600 "$client_containers_conf"
          export P12_ROOTLESS_CLIENT_CONTAINERS_CONF="$client_containers_conf"

          cat >"$delegated_wrapper" <<'WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          runtime_root="$1"
          socket="$2"
          run_user="$3"
          run_group="$4"
          run_uid="$5"
          run_gid="$6"
          run_home="$7"
          containers_conf="$8"
          if [ ! -f "$containers_conf" ] || [ -L "$containers_conf" ] || [ "$(stat -c '%u:%a' "$containers_conf")" != "$run_uid:600" ]; then
            exit 73
          fi
          control_group="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          case "$control_group" in
            /system.slice/p12-rootless-podman-*.service) ;;
            *) exit 71 ;;
          esac
          root="/sys/fs/cgroup${control_group}"
          daemon="$root/daemon"
          containers="$root/containers"
          mkdir "$daemon" "$containers"
          printf '%s\n' "$$" >"$daemon/cgroup.procs"
          available="$(cat "$root/cgroup.controllers")"
          for controller in cpu memory pids; do
            grep -qw "$controller" <<<"$available" || exit 72
            printf '+%s\n' "$controller" >"$root/cgroup.subtree_control"
            printf '+%s\n' "$controller" >"$containers/cgroup.subtree_control"
          done
          chown "$run_uid:$run_gid" "$containers"
          for delegated_file in cgroup.procs cgroup.threads cgroup.subtree_control; do
            if [ -e "$containers/$delegated_file" ]; then
              chown "$run_uid:$run_gid" "$containers/$delegated_file"
            fi
          done
          exec /usr/bin/setpriv \
            --reuid="$run_user" --regid="$run_group" --init-groups \
            /usr/bin/env XDG_RUNTIME_DIR="$runtime_root" HOME="$run_home" USER="$run_user" \
            CONTAINERS_CONF="$containers_conf" \
            /usr/bin/podman system service --time=0 "unix://$socket"
          WRAPPER
          chmod 0700 "$delegated_wrapper"
          command -v setpriv >/dev/null

          mapfile -t runtime_ids < <(python3 - <<'PY'
          import hashlib
          import os

          seed = "|".join(
              os.environ[name]
              for name in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB", "GITHUB_EVENT_NAME", "GITHUB_REF")
          )
          for cycle in (1, 2):
              digest = hashlib.sha256(f"{seed}|cycle={cycle}".encode()).hexdigest()[:32]
              print(f"mr_{digest}")
          PY
          )
          test "${#runtime_ids[@]}" -eq 2
          test "${runtime_ids[0]}" != "${runtime_ids[1]}"
          export P12_RUNTIME_ID_CYCLE_1="${runtime_ids[0]}"
          export P12_RUNTIME_ID_CYCLE_2="${runtime_ids[1]}"

          stop_service() {
            if [ -z "$service_unit" ]; then
              rm -f "$socket"
              return 0
            fi
            if sudo systemctl is-active --quiet "$service_unit"; then
              sudo systemctl stop "$service_unit"
              deadline=$((SECONDS + 10))
              while sudo systemctl is-active --quiet "$service_unit" && [ "$SECONDS" -lt "$deadline" ]; do
                sleep 0.1
              done
              if sudo systemctl is-active --quiet "$service_unit"; then
                sudo systemctl kill --kill-who=all --signal=SIGKILL "$service_unit" || true
              fi
            fi
            sudo systemctl reset-failed "$service_unit" 2>/dev/null || true
            service_pid=""
            service_unit=""
            unset P12_TOOLBOX_CGROUP_PARENT || true
            rm -f "$socket"
            test ! -e "$socket"
          }

          start_service() {
            stop_service
            rm -f "$socket"
            export XDG_RUNTIME_DIR="$runtime_root"
            mkdir -p "$runtime_root/podman"
            CONTAINERS_CONF="$client_containers_conf" podman system migrate
            service_generation=$((service_generation + 1))
            service_unit="${service_unit_base}-${service_generation}.service"
            sudo systemd-run \
              --collect \
              --unit="${service_unit%.service}" \
              --property=Type=simple \
              --property=Delegate=yes \
              --property=CPUAccounting=yes \
              --property=MemoryAccounting=yes \
              --property=TasksAccounting=yes \
              --property=KillMode=mixed \
              --property="StandardOutput=append:$RUNNER_TEMP/p12-podman-service.log" \
              --property="StandardError=append:$RUNNER_TEMP/p12-podman-service.log" \
              "$delegated_wrapper" "$runtime_root" "$socket" "$(id -un)" "$(id -gn)" "$(id -u)" "$(id -g)" "$HOME" "$client_containers_conf"
            deadline=$((SECONDS + 60))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if ! sudo systemctl is-active --quiet "$service_unit"; then
                echo "P12 rootless category=service_exit"
                return 1
              fi
              service_pid="$(sudo systemctl show --property=MainPID --value "$service_unit")"
              control_group="$(sudo systemctl show --property=ControlGroup --value "$service_unit")"
              case "$control_group" in
                /system.slice/"${service_unit}") ;;
                *) echo "P12 rootless category=cgroup_path"; return 1 ;;
              esac
              containers_cgroup="/sys/fs/cgroup${control_group}/containers"
              containers_subtree="$containers_cgroup/cgroup.subtree_control"
              if [ ! -r "$containers_subtree" ]; then
                sleep 0.25
                continue
              fi
              delegated_now="$(cat "$containers_subtree")"
              for controller in cpu memory pids; do
                if ! grep -qw "$controller" <<<"$delegated_now"; then
                  echo "P12 rootless category=cgroup_${controller}"
                  return 1
                fi
              done
              export P12_TOOLBOX_CGROUP_PARENT="$control_group/containers"
              if [ -S "$socket" ] && podman --url "unix://$socket" info >/dev/null 2>&1; then
                if [ "$service_pid" -le 1 ]; then
                  echo "P12 rootless category=service_identity"
                  return 1
                fi
                if [ "$(stat -c '%u' "$socket")" != "$(id -u)" ]; then
                  echo "P12 rootless category=socket_owner"
                  return 1
                fi
                mode="$(stat -c '%a' "$socket")"
                if [ "${mode: -1}" != "0" ]; then
                  echo "P12 rootless category=socket_mode"
                  return 1
                fi
                if ! cgroup_manager="$(podman --url "unix://$socket" info --format '{{.Host.CgroupManager}}')"; then
                  echo "P12 rootless category=cgroup_manager_query"
                  return 1
                fi
                if [ "$cgroup_manager" != "cgroupfs" ]; then
                  echo "P12 rootless category=cgroup_manager"
                  return 1
                fi
                return 0
              fi
              sleep 0.25
            done
            echo "P12 rootless category=socket_readiness"
            return 1
          }

          restore_rootful_sockets() {
            local index
            for index in "${!rootful_paths[@]}"; do
              sudo chmod "${rootful_modes[$index]}" "${rootful_paths[$index]}" || return 1
            done
          }

          cleanup() {
            original_status=$?
            trap - EXIT
            set +e
            unset P12_ROOTLESS_CLIENT_CONTAINERS_CONF || true
            rm -f "$RUNNER_TEMP/p12-podman-images.txt" "$delegated_wrapper" "$client_containers_conf"
            resource_cleanup_failed=0
            stop_failed=0
            restore_failed=0
            if [ -n "$service_unit" ] && sudo systemctl is-active --quiet "$service_unit"; then
              P12_ROOTLESS_CLEANUP_E2E=1 "$RUNNER_TEMP/p12-bin/trusted-linux-workcell.test" \
                -test.run=^TestTrustedLinuxWorkcellRootlessCleanupE2E$ -test.count=1 >/dev/null 2>&1 \
                || resource_cleanup_failed=1
            fi
            stop_service || stop_failed=1
            restore_rootful_sockets || restore_failed=1
            service_stopped=true
            socket_removed=true
            resources_cleaned=true
            permissions_restored=true
            if [ -n "$service_unit" ] && sudo systemctl is-active --quiet "$service_unit"; then
              service_stopped=false
            fi
            if [ -e "$socket" ]; then
              socket_removed=false
            fi
            if [ "$resource_cleanup_failed" -ne 0 ]; then
              resources_cleaned=false
            fi
            if [ "$restore_failed" -ne 0 ]; then
              permissions_restored=false
            fi
            if [ "$resource_cleanup_failed" -ne 0 ] || [ "$stop_failed" -ne 0 ] || [ "$restore_failed" -ne 0 ]; then
              cleanup_failed=1
            fi
            cat >artifacts/p12-trusted-linux-workcell-rootless-lifecycle-report.json <<EOF
          {"schema_version":1,"cleanup_trap_ran":true,"runtime_resources_cleaned":$resources_cleaned,"service_stopped":$service_stopped,"temporary_socket_removed":$socket_removed,"rootful_socket_permissions_restored":$permissions_restored}
          EOF
            if [ "$original_status" -ne 0 ]; then
              exit "$original_status"
            fi
            if [ "$cleanup_failed" -ne 0 ]; then
              exit 1
            fi
            exit 0
          }
          trap cleanup EXIT

          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$runtime_root"
          if ! grep -q "^${USER}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$USER"
            sudo usermod --add-subgids 100000-165535 "$USER"
          fi

          for candidate in /var/run/docker.sock /run/docker.sock; do
            if [ ! -S "$candidate" ]; then
              continue
            fi
            canonical="$(readlink -f "$candidate")"
            case "$canonical" in
              /run/docker.sock|/var/run/docker.sock) ;;
              *) echo "P12 rootless category=rootful_socket_path"; exit 1 ;;
            esac
            duplicate=false
            for existing in "${rootful_paths[@]}"; do
              if [ "$existing" = "$canonical" ]; then
                duplicate=true
              fi
            done
            if [ "$duplicate" = false ]; then
              rootful_paths+=("$canonical")
              rootful_modes+=("$(stat -Lc '%a' "$canonical")")
              sudo chmod 000 "$canonical"
            fi
          done

          python3 - <<'PY'
          import os
          import socket

          for path in ("/var/run/docker.sock", "/run/docker.sock"):
              if not os.path.exists(path):
                  continue
              client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              client.settimeout(0.5)
              try:
                  client.connect(path)
              except OSError:
                  pass
              else:
                  raise SystemExit("rootful socket remained accessible")
              finally:
                  client.close()
          PY

          start_service

          MCP_DEVBOX_BROWSER_HARNESS_E2E=1 "$RUNNER_TEMP/p12-bin/trusted-linux-workcell.test" \
            -test.run=^TestProjectBrowserHarnessRealPlaywrightE2E$ -test.count=1 -test.v

          archive="$RUNNER_TEMP/p12-postgres-17-alpine.tar"
          podman --url "unix://$socket" load --input "$archive" >/dev/null
          postgres_image_id="$(python3 - "$archive" <<'PY'
          import json
          import re
          import sys
          import tarfile

          archive = sys.argv[1]
          with tarfile.open(archive, "r") as bundle:
              source = bundle.extractfile("manifest.json")
              if source is None:
                  raise SystemExit("P12 rootless category=postgres_image_manifest")
              manifest = json.load(source)
          if len(manifest) != 1:
              raise SystemExit("P12 rootless category=postgres_image_manifest")
          config = manifest[0].get("Config", "")
          match = re.fullmatch(r"(?:blobs/sha256/)?([0-9a-f]{64})(?:\.json)?", config)
          if match is None:
              raise SystemExit("P12 rootless category=postgres_image_manifest")
          print("sha256:" + match.group(1))
          PY
          )"
          postgres_image="localhost/p12-postgres-fixture:${postgres_image_id#sha256:}"
          images_file="$RUNNER_TEMP/p12-podman-images.txt"
          if ! podman --url "unix://$socket" images --no-trunc --format '{{.ID}}' >"$images_file"; then
            echo "P12 rootless category=postgres_image_inventory"
            exit 1
          fi

          if ! loaded_postgres_image_id="$(python3 - "$postgres_image_id" "$images_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          target = sys.argv[1]
          match = re.fullmatch(r"sha256:([0-9a-f]{64})", target)
          if match is None:
              raise SystemExit(1)
          target = match.group(1)
          path = Path(sys.argv[2])
          if path.stat().st_size > (64 << 10):
              raise SystemExit(1)
          matches = set()
          for line in path.read_text(errors="strict").splitlines():
              line = line.strip()
              if not line:
                  continue
              image = re.fullmatch(r"(?:sha256:)?([0-9a-f]{64})", line)
              if image is None:
                  raise SystemExit(1)
              if image.group(1) == target:
                  matches.add(image.group(1))
          if matches != {target}:
              raise SystemExit(1)
          print("sha256:" + target)
          PY
          )"; then
            echo "P12 rootless category=postgres_image_loaded_id"
            exit 1
          fi
          rm -f "$images_file"

          if existing_postgres_image_id="$(podman --url "unix://$socket" image inspect --format '{{.Id}}' "$postgres_image" 2>/dev/null)"; then
            if [ "${existing_postgres_image_id#sha256:}" != "${postgres_image_id#sha256:}" ]; then
              echo "P12 rootless category=postgres_image_conflict"
              exit 1
            fi
          elif ! podman --url "unix://$socket" tag "$loaded_postgres_image_id" "$postgres_image"; then
            echo "P12 rootless category=postgres_image_tag"
            exit 1
          fi

          if ! inspected_postgres_image_id="$(podman --url "unix://$socket" image inspect --format '{{.Id}}' "$postgres_image")"; then
            echo "P12 rootless category=postgres_image_inspect"
            exit 1
          fi
          if [ "${inspected_postgres_image_id#sha256:}" != "${postgres_image_id#sha256:}" ]; then
            echo "P12 rootless category=postgres_image_identity"
            exit 1
          fi
          export P12_POSTGRES_IMAGE="$postgres_image"
          rm -f "$archive"
          P12_ROOTLESS_CLEANUP_E2E=1 "$RUNNER_TEMP/p12-bin/trusted-linux-workcell.test" \
            -test.run=^TestTrustedLinuxWorkcellRootlessCleanupE2E$ -test.count=1 >/dev/null 2>&1

          set +e
          P12_ROOTLESS_E2E=1 "$RUNNER_TEMP/p12-bin/trusted-linux-workcell.test" \
            -test.run=^TestTrustedLinuxWorkcellRootlessE2E$ -test.count=1 -test.v 2>&1 \
            | "$RUNNER_TEMP/p12-bin/rootless-e2e-log-redactor" \
            | tee artifacts/p12-rootless-test.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test_status="${pipeline_status[0]}"
          redactor_status="${pipeline_status[1]}"
          tee_status="${pipeline_status[2]}"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          if [ "$redactor_status" -ne 0 ] || [ "$tee_status" -ne 0 ]; then
            echo "P12 rootless category=redactor_failure"
            exit 1
          fi
          rm -f artifacts/p12-rootless-test.log

          stop_service
          start_service

          set +e
          P12_ROOTLESS_RESTART_E2E=1 "$RUNNER_TEMP/p12-bin/trusted-linux-workcell.test" \
            -test.run=^TestTrustedLinuxWorkcellRootlessRestartE2E$ -test.count=1 -test.v 2>&1 \
            | "$RUNNER_TEMP/p12-bin/rootless-e2e-log-redactor" \
            | tee artifacts/p12-rootless-test.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test_status="${pipeline_status[0]}"
          redactor_status="${pipeline_status[1]}"
          tee_status="${pipeline_status[2]}"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          if [ "$redactor_status" -ne 0 ] || [ "$tee_status" -ne 0 ]; then
            echo "P12 rootless category=redactor_failure"
            exit 1
          fi
          rm -f artifacts/p12-rootless-test.log

      - name: Annotate rootless E2E failure
        if: ${{ failure() && hashFiles('artifacts/p12-rootless-test.log') != '' }}
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          allowed = re.compile(r"^(?:=== RUN   TestTrustedLinuxWorkcellRootless(?:E2E|RestartE2E)|--- FAIL: TestTrustedLinuxWorkcellRootless(?:E2E|RestartE2E) \([0-9.]+s\)|FAIL|P12 rootless category=[a-z_]+)$")
          lines = [line for line in Path("artifacts/p12-rootless-test.log").read_text(errors="replace").splitlines() if allowed.fullmatch(line)]
          summary = "\n".join(lines[-30:])[-2000:] or "P12 rootless category=unknown"
          escaped = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=internal/edgeclient/trusted_linux_workcell_e2e_test.go,line=1,title=Rootless workcell E2E failure::{escaped}")
          PY

      - name: Upload rootless failure diagnostic
        if: ${{ failure() && hashFiles('artifacts/p12-rootless-test.log') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p12-rootless-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/p12-rootless-test.log
          if-no-files-found: error
          retention-days: 14

      - name: Verify two-cycle rootless evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for cycle in (1, 2):
              report = json.loads(Path(f"artifacts/p12-trusted-linux-workcell-rootless-cycle-{cycle}-report.json").read_text())
              assert report["schema_version"] == 1
              assert report["cycle"] == cycle
              for key in (
                  "endpoint_validated",
                  "rootful_socket_inaccessible",
                  "clean_start",
                  "image_built",
                  "workspace_bind_validated",
                  "pod_created",
                  "compose_ran",
                  "postgresql_healthy",
                  "postgresql_ready",
                  "chromium_ready",
                  "cancellation_ran",
                  "processes_cleaned",
                  "containers_cleaned",
                  "pods_cleaned",
                  "networks_cleaned",
                  "volumes_cleaned",
                  "rootless_socket_owned_by_user",
                  "rootless_socket_permissions",
              ):
                  assert report[key] is True
              assert report["second_cycle_clean_start"] is (cycle == 2)

          restart = json.loads(Path("artifacts/p12-trusted-linux-workcell-rootless-restart-report.json").read_text())
          assert restart["schema_version"] == 1
          assert restart["service_restarted"] is True
          assert restart["cycles_checked"] == 2
          assert restart["orphan_resources"] == 0

          lifecycle = json.loads(Path("artifacts/p12-trusted-linux-workcell-rootless-lifecycle-report.json").read_text())
          assert lifecycle["schema_version"] == 1
          assert lifecycle["cleanup_trap_ran"] is True
          assert lifecycle["runtime_resources_cleaned"] is True
          assert lifecycle["service_stopped"] is True
          assert lifecycle["temporary_socket_removed"] is True
          assert lifecycle["rootful_socket_permissions_restored"] is True
          PY

      - name: Upload rootless evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p12-rootless-runtime-e2e-${{ github.sha }}
          path: |
            artifacts/p12-trusted-linux-workcell-rootless-cycle-1-report.json
            artifacts/p12-trusted-linux-workcell-rootless-cycle-2-report.json
            artifacts/p12-trusted-linux-workcell-rootless-restart-report.json
            artifacts/p12-trusted-linux-workcell-rootless-lifecycle-report.json
          if-no-files-found: warn
          retention-days: 30
