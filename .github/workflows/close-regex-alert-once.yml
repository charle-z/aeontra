name: Close regex false positive once

on:
  push:
    branches:
      - ops/close-regex-alert
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover_alerts:
    name: Regex alert discovery
    if: github.ref == 'refs/heads/ops/close-regex-alert'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    outputs:
      alert_numbers: ${{ steps.discover.outputs.result }}
    steps:
      - name: Find exact historical regex alerts
        id: discover
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const alerts = await github.paginate(github.rest.codeScanning.listAlertsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const matches = alerts.filter((alert) =>
              alert.rule?.id === 'go/regex/missing-regexp-anchor' &&
              alert.most_recent_instance?.location?.path === 'internal/policy/scan.go' &&
              alert.most_recent_instance?.ref === 'refs/heads/main'
            );
            if (matches.length === 0) {
              core.notice('No matching open alert remains; current CodeQL already closed it.');
              return '[]';
            }
            const numbers = matches.map((alert) => alert.number);
            if (numbers.some((number) => !Number.isSafeInteger(number) || number < 1)) {
              core.setFailed('GitHub returned an invalid alert number.');
              return '[]';
            }
            core.notice(`Found ${numbers.length} exact alert record(s) across CodeQL configurations.`);
            return JSON.stringify(numbers);

  dismiss_alerts:
    name: Regex alert dismissal request
    needs: discover_alerts
    if: github.ref == 'refs/heads/ops/close-regex-alert'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    outputs:
      result: ${{ steps.dismiss.outputs.result }}
    steps:
      - name: Update exact historical regex alerts
        id: dismiss
        uses: actions/github-script@v8
        env:
          ALERT_NUMBERS: ${{ needs.discover_alerts.outputs.alert_numbers }}
        with:
          result-encoding: string
          script: |
            const comment = 'This regular expression intentionally searches for GitHub tokens embedded inside arbitrary text. Anchoring it would break secret detection for logs, JSON, command output and source content. The behavior is covered by embedded-token, multiple-token and large-input tests, and the suppression is scoped to this exact query and expression.';
            const numbers = JSON.parse(process.env.ALERT_NUMBERS || '[]');
            try {
              for (const alertNumber of numbers) {
                await github.request('PATCH /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  alert_number: alertNumber,
                  state: 'dismissed',
                  dismissed_reason: 'false positive',
                  dismissed_comment: comment,
                  create_request: true,
                  headers: {
                    'X-GitHub-Api-Version': '2026-03-10',
                  },
                });
              }
              core.notice(`Updated ${numbers.length} exact alert record(s).`);
              return 'ok';
            } catch (error) {
              const status = error?.status ?? error?.response?.status ?? 0;
              core.notice(`GitHub rejected the update with HTTP ${status || 'unknown'}.`);
              return String(status || 'unknown');
            }

  dismiss_forbidden:
    name: Regex alert dismissal forbidden (HTTP 403)
    needs: dismiss_alerts
    if: needs.dismiss_alerts.outputs.result == '403'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: actions/github-script@v8
        with:
          script: core.setFailed('GitHub rejected the exact alert update with HTTP 403.');

  dismiss_invalid:
    name: Regex alert dismissal rejected (HTTP 400/422)
    needs: dismiss_alerts
    if: needs.dismiss_alerts.outputs.result == '400' || needs.dismiss_alerts.outputs.result == '422'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: actions/github-script@v8
        with:
          script: core.setFailed('GitHub rejected the exact alert update as invalid.');

  dismiss_unexpected:
    name: Regex alert dismissal unexpected response
    needs: dismiss_alerts
    if: ${{ !contains(fromJSON('["ok","403","400","422"]'), needs.dismiss_alerts.outputs.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: actions/github-script@v8
        with:
          script: core.setFailed('GitHub returned an unexpected status for the exact alert update.');

  verify_alerts:
    name: Regex alert verification
    needs: [discover_alerts, dismiss_alerts]
    if: needs.dismiss_alerts.outputs.result == 'ok'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Verify exact alert state
        uses: actions/github-script@v8
        env:
          ALERT_NUMBERS: ${{ needs.discover_alerts.outputs.alert_numbers }}
        with:
          script: |
            const comment = 'This regular expression intentionally searches for GitHub tokens embedded inside arbitrary text. Anchoring it would break secret detection for logs, JSON, command output and source content. The behavior is covered by embedded-token, multiple-token and large-input tests, and the suppression is scoped to this exact query and expression.';
            const numbers = JSON.parse(process.env.ALERT_NUMBERS || '[]');
            for (const alertNumber of numbers) {
              const verified = await github.rest.codeScanning.getAlert({
                owner: context.repo.owner,
                repo: context.repo.repo,
                alert_number: alertNumber,
              });
              if (verified.data.rule?.id !== 'go/regex/missing-regexp-anchor' ||
                  verified.data.most_recent_instance?.location?.path !== 'internal/policy/scan.go' ||
                  verified.data.state !== 'dismissed' ||
                  verified.data.dismissed_reason !== 'false positive' ||
                  verified.data.dismissed_comment !== comment) {
                core.setFailed(`Alert ${alertNumber} dismissal verification failed.`);
                return;
              }
            }
            const remaining = await github.paginate(github.rest.codeScanning.listAlertsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const exactRemaining = remaining.filter((alert) =>
              alert.rule?.id === 'go/regex/missing-regexp-anchor' &&
              alert.most_recent_instance?.location?.path === 'internal/policy/scan.go' &&
              alert.most_recent_instance?.ref === 'refs/heads/main'
            );
            if (exactRemaining.length !== 0) {
              core.setFailed(`${exactRemaining.length} exact alert record(s) remain open.`);
              return;
            }
            core.notice(`Verified ${numbers.length} dismissal(s); no exact alert remains open.`);
