name: Temporary runtime remediation retirement
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-remediation-retirement
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Check expiry and official replacement availability
        run: python3 scripts/check-runtime-remediation-upstream.py
